    alocasia_amazonica:
      plant_name: Алоказия (Polly / Amazonica)
      group: A
      sensitivity: very_high
      notes: Очень чувствительна к солям и переливу

    alocasia_frydek:
      plant_name: Алоказия Фрайдек
      group: A
      sensitivity: very_high
      notes: Бархатная алоказия — очень чувствительна к солям

    alocasia_regal_shields:
      plant_name: Алоказия Регал Шилдс
      group: A
      sensitivity: very_high
      notes: Крупная алоказия — чувствительна к солям в воде

    anthurium_andraeanum:
