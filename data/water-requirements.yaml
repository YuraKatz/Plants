      notes: Чувствителен к солям, любит мягкую воду

    sansevieria:
      plant_name: Сансевиерия
      group: C
      sensitivity: very_low
      notes: Крайне неприхотлива

    zamioculcas:
      plant_name: Замиокулькас (ZZ plant)
      group: C
      sensitivity: very_low
      notes: Крайне неприхотлив к качеству воды

    schlumbergera:
      plant_name: Шлюмбергера (Декабрист)
      group: C
      sensitivity: low
      notes: Не требователен к качеству воды

    anthurium_clarinervium:
      plant_name: Антуриум кларинервиум
      group: A
      sensitivity: very_high
      notes: Бархатный антуриум — очень чувствителен к солям

    dionaea:
      plant_name: Дионея (Венерина мухоловка)
      group: carnivorous
      sensitivity: critical
      notes: ТОЛЬКО чистый RO! Любые добавки убивают!

  common_mistakes:
    - mistake: Добавлять удобрение ДО CalMag
      rule: Всегда сначала CalMag, потом удобрение
    - mistake: Не измерять PPM после каждого шага
      rule: Измерять PPM после CalMag и после удобрения
    - mistake: Корректировать pH до добавления удобрений
      rule: pH только в самом конце, после всех добавок
    - mistake: Хранить раствор с удобрением долго
      rule: Готовить свежий раствор на каждый полив
    - mistake: Использовать одинаковый PPM для грунта и semi-hydro
      rule: Semi-hydro получает удобрение каждый долив, но слабее
    - mistake: Чистый RO без CalMag (кроме хищных)
      rule: Всегда добавлять CalMag как базу
    - mistake: Одинаковый рецепт для орхидей и остальных группы A
      rule: Орхидеи — отдельная группа с самым низким PPM

  ph_policy:
    priority: Последний шаг в процессе
    method: pH Down (Green Farmer) по каплям
    note: Добавлять pH Down ТОЛЬКО после CalMag + удобрение
    tip: CalMag обычно поднимает pH, удобрения могут понижать — поэтому pH в конце

  measurement_tools:
    tds_meter:
      measures: PPM (Total Dissolved Solids)
      importance: Критично — используется на каждом шаге
      calibration: Регулярная калибровка обязательна

    ph_meter:
      measures: Кислотность (pH)
      importance: Важно — используется на последнем шаге
      calibration: Регулярная калибровка обязательна
      adjustment: pH Down (Green Farmer) по каплям

  troubleshooting:
    salt_buildup:
      signs:
        - Белый налёт на поверхности грунта
        - Коричневые кончики листьев
        - Общее угнетение роста
        - В semi-hydro — белый налёт на камнях
      solution:
        - Промыть грунт/субстрат чистой RO водой
        - Снизить PPM в следующих поливах
        - Проверить дренаж
        - Semi-hydro — замочить субстрат в RO воде на 30 мин

    ph_problems:
      high_ph:
        signs:
          - Пожелтение листьев (хлороз)
          - Плохое усвоение микроэлементов
        solution: Добавить pH Down по каплям

      low_ph:
        signs:
          - Некроз краёв листьев
          - Токсичность алюминия и марганца
        solution: Уменьшить дозу pH Down или разбавить водой
