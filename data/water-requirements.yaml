water_requirements:
  base_principle: RO (осмос) → CalMag → Удобрение → pH

  operational_mode:
    goal: стабильность
    method: пошаговое смешивание под каждый полив
    rule_1: Всегда начинать с RO воды (0 PPM)
    rule_2: CalMag первый, удобрение второй — никогда наоборот
    rule_3: Измерять PPM после каждого шага
    rule_4: pH корректировать только в конце
    rule_5: Стабильность важнее точности

  mixing_protocol:
    step_1:
      action: Налить RO воду
      target_ppm: 0
      note: Чистая осмос-вода, TDS метр должен показывать 0-10

    step_2:
      action: Добавить CalMag (ATAMI CALMAG)
      method: По каплям, измеряя PPM
      note: Довести до базового PPM группы

    step_3:
      action: Добавить удобрение
      method: По каплям/дозе, измеряя PPM
      note: Довести до целевого PPM группы (в сезон роста)

    step_4:
      action: Скорректировать pH
      method: pH Down (Green Farmer) по каплям
      note: Довести до целевого pH группы

    step_5:
      action: Перемешать и полить
      note: Использовать сразу, не хранить долго

  water_groups:
    group_a:
      name: Чувствительные
      color: red
      after_calmag_ppm: 50
      after_fertilizer_ppm:
        growth: 80-100
        rest: 50
      ph_target: 5.8-6.3
      fertilizer_dose:
        growth: 1/4 от инструкции (Universal)
        rest: НЕ удобрять
      plants:
        - Калатея лансифолия
        - Калатея орната
        - Спатифиллум
        - Гузмания
        - Алоказия (Polly / Amazonica)
        - Алоказия Фрайдек
        - Алоказия Регал Шилдс
        - Антуриум
        - Антуриум кларинервиум
        - Папоротник (Нефролепис)
      sensitivity_level: Очень высокая

    group_orchids:
      name: Орхидеи
      color: purple
      after_calmag_ppm: 30
      after_fertilizer_ppm:
        growth: 60-80
        blooming: 80-100
        rest: 30
      ph_target: 5.5-6.0
      fertilizer_dose:
        growth: 1/8 от инструкции (Universal — вегетация)
        blooming: Orchid fertilizer (по инструкции, слабая доза)
        rest: НЕ удобрять
      plants:
        - Орхидея (Phalaenopsis)
      sensitivity_level: Очень высокая
      notes:
        - Орхидеи требуют самый низкий PPM
        - CalMag минимально — только базовые минералы
        - При цветении использовать удобрение для орхидей вместо универсального
        - Полив методом замачивания 15-20 минут
        - Не допускать накопления солей в субстрате

    group_b:
      name: Ароидные и стандартные
      color: blue
      after_calmag_ppm: 60
      after_fertilizer_ppm:
        growth: 120-150
        rest: 60-80
      ph_target: 6.0-6.5
      fertilizer_dose:
        growth: 1/2 от инструкции (Universal)
        rest: 1/4 от инструкции или НЕ удобрять
      plants:
        - Монстера делициоза
        - Монстера адансони
        - Филодендрон
        - Филодендрон Селлоу
        - Филодендрон Ксанаду
        - Эпипремнум
        - Аглаонема
        - Бегония макулата
        - Хамедорея
        - Хлорофитум
      sensitivity_level: Средняя

    group_c:
      name: Неприхотливые
      color: green
      after_calmag_ppm: 80
      after_fertilizer_ppm:
        growth: 150-200
        rest: 80-100
      ph_target: 6.2-6.7
      fertilizer_dose:
        growth: 1/2 от инструкции (Universal)
        rest: НЕ удобрять
      plants:
        - Драцена маргината
        - Драцена фрагранс
        - Кротон
        - Сансевиерия
        - Замиокулькас (ZZ plant)
        - Шлюмбергера (Декабрист)
      sensitivity_level: Низкая

    group_semi_hydro:
      name: Semi-Hydro
      color: orange
      after_calmag_ppm: 60
      after_fertilizer_ppm:
        growth: 150-180
        rest: 80-100
      ph_target: 5.5-6.0
      fertilizer_dose:
        growth: 1/2 от инструкции (Universal) — каждый долив
        rest: 1/4 от инструкции
      plants: []
      sensitivity_level: Средняя
      notes:
        - В semi-hydro удобрение нужно КАЖДЫЙ раз при доливе воды
        - Субстрат инертный — нет питательных веществ кроме того что в воде
        - pH ниже чем в грунте — минералы в субстрате (цеолит, лава) работают лучше при 5.5-6.0
        - Раз в месяц промывать субстрат чистой RO водой для удаления солей
        - При переводе из грунта — первые 2-3 недели только CalMag без удобрений

    group_carnivorous:
      name: Хищные
      color: black
      after_calmag_ppm: 0
      after_fertilizer_ppm:
        growth: 0
        rest: 0
      ph_target: 5.0-5.5
      fertilizer_dose:
        growth: НИЧЕГО! Только чистый RO
        rest: НИЧЕГО! Только чистый RO
      plants:
        - Дионея (Венерина мухоловка)
      sensitivity_level: Критическая
      notes:
        - НИКАКИХ добавок в воду
        - Только чистый RO (TDS < 10)
        - Любые минералы/удобрения убивают растение

  individual_requirements:
    calathea_lancifolia:
      plant_name: Калатея лансифолия
      group: A
      sensitivity: very_high
      notes: Очень чувствительна к солям

    calathea_ornata:
      plant_name: Калатея орната
      group: A
      sensitivity: very_high
      notes: Очень чувствительна к солям

    spathiphyllum:
      plant_name: Спатифиллум
      group: A
      sensitivity: very_high
      notes: Не терпит жёсткую воду

    phalaenopsis:
      plant_name: Орхидея (Phalaenopsis)
      group: orchids
      sensitivity: very_high
      notes: Минимальный PPM, замачивание, без накопления солей

    guzmania:
      plant_name: Гузмания
      group: A
      sensitivity: very_high
      notes: Особенно для воды в розетке

    begonia_maculata:
      plant_name: Бегония макулата
      group: B
      sensitivity: medium
      notes: Важнее не перелить, чем ppm

    monstera_deliciosa:
      plant_name: Монстера делициоза
      group: B
      sensitivity: low
      notes: Стабильность важнее точного значения

    monstera_adansonii:
      plant_name: Монстера адансони
      group: B
      sensitivity: low
      notes: Стабильность важнее точного значения

    philodendron:
      plant_name: Филодендрон
      group: B
      sensitivity: low
      notes: Аналогично монстере

    epipremnum:
      plant_name: Эпипремнум
      group: B
      sensitivity: low
      notes: Прощает ошибки

    aglaonema:
      plant_name: Аглаонема
      group: B
      sensitivity: medium
      notes: Лучше ближе к нижней границе

    chamaedorea:
      plant_name: Хамедорея
      group: B
      sensitivity: medium
      notes: Не любит накопление солей

    dracaena_marginata:
      plant_name: Драцена маргината
      group: C
      sensitivity: low
      notes: Выносливая, но не переливать

    dracaena_fragrans:
      plant_name: Драцена фрагранс
      group: C
      sensitivity: low
      notes: Выносливая, но не переливать

    croton:
      plant_name: Кротон
      group: C
      sensitivity: medium
      notes: Любит питание, но без фанатизма

    chlorophytum_comosum:
      plant_name: Хлорофитум
      group: B
      sensitivity: low
      notes: Неприхотлив, прощает ошибки

    philodendron_selloum:
      plant_name: Филодендрон Селлоу
      group: B
      sensitivity: low
