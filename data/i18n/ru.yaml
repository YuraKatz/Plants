# Propagation — tabs & banner
propagation_best_time: "🌸 Лучшее время для размножения: Весна — Начало лета"
propagation_tab_water: "💧 В воде"
propagation_tab_soil: "🌱 В грунте"
propagation_tab_division: "✂️ Деление"
propagation_tab_airlayer: "🌿 Воздушные отводки"
propagation_tab_offsets: "👶 Детки"
propagation_steps_title: "Пошаговая инструкция"
propagation_plants_title: "Подходит для растений"
propagation_tips_title: "Советы эксперта"
propagation_water_desc: "Самый простой и наглядный способ. Подходит для большинства лиан и ароидных."
propagation_water_step_1: "Отрежьте черенок с 1-2 узлами (откуда растут листья)."
propagation_water_step_2: "Удалите нижние листья, чтобы они не гнили в воде."
propagation_water_step_3: "Поместите в воду. Добавьте кусочек древесного угля."
propagation_water_step_4: "Ждите корней 2-5 см, затем сажайте в легкий грунт."
propagation_water_tip_1: "Используйте темную емкость — корни любят темноту."
propagation_water_tip_2: "Меняйте воду раз в неделю."
propagation_soil_desc: "Для растений, которые плохо переносят воду или имеют нежные корни."
propagation_soil_step_1: "Подготовьте черенок и дайте срезу подсохнуть 30-60 мин."
propagation_soil_step_2: "Обмакните срез в Корневин (опционально)."
propagation_soil_step_3: "Посадите в легкую смесь (торф + перлит 50/50)."
propagation_soil_step_4: "Накройте пакетом или банкой для создания теплички."
propagation_soil_tip_1: "Проветривайте тепличку каждый день."
propagation_soil_tip_2: "Не заливайте — грунт должен быть лишь слегка влажным."
propagation_division_desc: "Для кустовых растений, образующих розетки или имеющих корневища."
propagation_division_step_1: "Достаньте растение из горшка и очистите корни от земли."
propagation_division_step_2: "Аккуратно разделите куст руками или острым ножом."
propagation_division_step_3: "У каждой части должны быть свои корни и точка роста."
propagation_division_step_4: "Рассадите в отдельные горшки."
propagation_division_tip_1: "Присыпьте срезы углем или корицей."
propagation_division_tip_2: "Первую неделю держите в тени."
propagation_airlayer_desc: "Для крупных древовидных растений (фикусы, монстеры), чтобы получить сразу большое растение."
propagation_airlayer_step_1: "Сделайте надрез на стебле или снимите кольцо коры."
propagation_airlayer_step_2: "Оберните влажным мхом сфагнумом."
propagation_airlayer_step_3: "Закрепите сверху пленкой, чтобы мох не высыхал."
propagation_airlayer_step_4: "Когда корни заполнят пленку, отрежьте и посадите."
propagation_airlayer_tip_1: "Используйте мох, смоченный в растворе стимулятора."
propagation_airlayer_tip_2: "Метод позволяет сохранить вариегатность."
propagation_offsets_desc: "Для растений, которые сами выпускают \"деток\" на усах или у основания."
propagation_offsets_step_1: "Дождитесь, пока у детки появятся свои зачатки корней."
propagation_offsets_step_2: "Отрежьте детку от материнского растения."
propagation_offsets_step_3: "Посадите в маленький горшочек с легким грунтом."
propagation_offsets_step_4: "Первое время поддерживайте высокую влажность."
propagation_offsets_tip_1: "Не отделяйте слишком маленьких деток."
propagation_offsets_tip_2: "Хлорофитум можно укоренять прямо не отрезая от уса."

