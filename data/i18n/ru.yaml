fert_universal_desc: "Универсальное жидкое удобрение NPK 5-5-7. Подходит для большинства растений в период активного роста."
fert_flowering_desc: "Удобрение для цветущих растений с повышенным содержанием фосфора и калия. Стимулирует цветение."
fert_multicote_desc: "Гранулированное удобрение пролонгированного действия. НЕ использовать на фитильном поливе!"
fert_orchids_desc: "Специальное удобрение для орхидей в фазе цветения. 0% азота, 17% фосфора — только для цветения!"
fert_dynomyco_desc: "Микориза + бактерии Bacillus + гуминовая кислота. 1 ч.л. на 4 л, каждые 1-2 недели. Для укоренения и пересадки."
fert_bioup_desc: "Органический pH Up на гуминовых кислотах. 0.1 мл/л = +0.1 pH. Не вредит микоризе!"
fert_phdown_desc: "Минеральный pH Down. По каплям до нужного значения. Использовать с осторожностью."
fert_rule_calmag: "Используйте только с RO (осмос) водой для предотвращения дефицита минералов."
fert_rule_ph: "Регулируйте в конце, после всех добавок. Bio·Up для повышения (органика), pH- для понижения."
fert_rule_dynomyco: "После применения НЕ вносить фосфорные удобрения — высокий P подавляет микоризу."
fert_rule_multicote: "Запрещён для растений на фитильном поливе — вымывается и вызывает ожог корней."

