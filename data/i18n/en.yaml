  "Переклассифицирован в род Thaumatophyllum": "Reclassified into the genus Thaumatophyllum"
  "Много жёлтых листьев → перелив или тесный горшок": "Many yellow leaves → overwatering or pot bound"
  "Листья поникли → недолив или мало света": "Drooping leaves → underwatering or lack of light"
  "Коричневые края → сухой воздух или ожог": "Brown edges → dry air or burn"
  "Одно из самых неубиваемых растений": "One of the most indestructible plants"
