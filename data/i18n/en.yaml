  "Потеря пестроты → мало света": "Loss of variegation → not enough light"
  "Гниль стебля → перелив + холод": "Stem rot → overwatering + cold"
  "Считается символом удачи в Азии": "Considered a symbol of good luck in Asia"
  "Выживает при минимальном освещении": "Survives in minimal lighting"
  "Существует более 100 сортов": "More than 100 varieties exist"
  "Скручиваются листья → холод или сквозняк": "Curling leaves → cold or draft"
  "Бледнеет окраска → слишком темно": "Fading color → too dark"
  "Коричневые кончики → сухой воздух": "Brown tips → dry air"
  " 'Женское счастье' — популярное название": " 'Peace Lily' — popular name"
  "Цветёт белыми 'парусами' круглый год": "Blooms with white 'sails' year-round"
