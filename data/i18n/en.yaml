  "Коричневые пятна → солнечный ожог": "Brown spots → sunburn"
  "Называют 'швейцарский сыр' за форму отверстий": "Called 'Swiss cheese' for the shape of its holes"
  "Быстро растёт — до 30 см в месяц летом": "Grows fast — up to 30 cm per month in summer"
  "Отлично смотрится в подвесных кашпо": "Looks great in hanging pots"
  "Желтеют нижние листья → естественное старение": "Lower leaves turn yellow → natural aging"
  "Мелкие листья без дырок → мало света": "Small leaves without holes → not enough light"
  "Коричневые края → низкая влажность": "Brown edges → low humidity"
  "Название означает 'любящий деревья' (греч.)": "The name means 'tree-loving' (Greek)"
  "Более 400 видов в семействе": "More than 400 species in the family"
  "Очищает воздух от формальдегида": "Purifies the air from formaldehyde"
  "Вытянутые стебли → недостаток света": "Leggy stems → lack of light"
  "Жёлтые листья → перелив": "Yellow leaves → overwatering"
  "Мелкие листья → нужна подкормка": "Small leaves → needs feeding"
  "В природе вырастает до 3-5 метров в ширину": "In nature, grows 3-5 meters wide"
