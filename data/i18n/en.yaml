soil_notes:
  "Дырки в листьях помогают выдержать тропические ливни": "Holes in the leaves help withstand tropical downpours"
  "В природе плоды съедобны и пахнут ананасом": "In nature, fruits are edible and smell like pineapple"
  "Может вырасти до 20 метров в джунглях": "Can grow up to 20 meters in the jungle"
  "Жёлтые листья → перелив или недостаток света": "Yellow leaves → overwatering or lack of light"
