# Propagation — tabs & banner
propagation_best_time: "🌸 Best time for propagation: Spring — Early summer"
propagation_tab_water: "💧 In water"
propagation_tab_soil: "🌱 In soil"
propagation_tab_division: "✂️ Division"
propagation_tab_airlayer: "🌿 Air layering"
propagation_tab_offsets: "👶 Offsets"
propagation_steps_title: "Step-by-Step Instructions"
propagation_plants_title: "Suitable for plants"
propagation_tips_title: "Expert Tips"
propagation_water_desc: "The simplest and most visual method. Suitable for most vines and aroids."
propagation_water_step_1: "Cut a cutting with 1-2 nodes (where leaves grow)."
propagation_water_step_2: "Remove lower leaves so they don't rot in water."
propagation_water_step_3: "Place in water. Add a piece of charcoal."
propagation_water_step_4: "Wait for 2-5 cm roots, then plant in light soil."
propagation_water_tip_1: "Use a dark container — roots love darkness."
propagation_water_tip_2: "Change water once a week."
propagation_soil_desc: "For plants that don't tolerate water well or have delicate roots."
propagation_soil_step_1: "Prepare cutting and let the cut dry for 30-60 min."
propagation_soil_step_2: "Dip the cut in rooting hormone (optional)."
propagation_soil_step_3: "Plant in a light mix (peat + perlite 50/50)."
propagation_soil_step_4: "Cover with a bag or jar to create a greenhouse."
propagation_soil_tip_1: "Ventilate the greenhouse every day."
propagation_soil_tip_2: "Do not overwater — soil should be only slightly moist."
propagation_division_desc: "For bushy plants that form rosettes or have rhizomes."
propagation_division_step_1: "Remove plant from pot and clean soil from roots."
propagation_division_step_2: "Carefully divide the bush by hand or with a sharp knife."
propagation_division_step_3: "Each part should have its own roots and growth point."
propagation_division_step_4: "Plant in separate pots."
propagation_division_tip_1: "Dust cuts with charcoal or cinnamon."
propagation_division_tip_2: "Keep in shade for the first week."
propagation_airlayer_desc: "For large woody plants (ficus, monstera) to get a large plant immediately."
propagation_airlayer_step_1: "Make a cut on the stem or remove a ring of bark."
propagation_airlayer_step_2: "Wrap with moist sphagnum moss."
propagation_airlayer_step_3: "Secure with plastic wrap so the moss doesn't dry out."
propagation_airlayer_step_4: "When roots fill the wrap, cut and plant."
propagation_airlayer_tip_1: "Use moss soaked in stimulant solution."
propagation_airlayer_tip_2: "Method helps preserve variegation."
propagation_offsets_desc: "For plants that produce 'babies' on runners or at the base."
propagation_offsets_step_1: "Wait until the offset has its own root nubs."
propagation_offsets_step_2: "Cut the offset from the mother plant."
propagation_offsets_step_3: "Plant in a small pot with light soil."
propagation_offsets_step_4: "Maintain high humidity initially."
propagation_offsets_tip_1: "Don't separate offsets that are too small."
propagation_offsets_tip_2: "Chlorophytum can be rooted without cutting from the runner."

