fertilizers:
  liquid:
    flower_universal:
      name: FLOWER - UNIVERSAL FERTILIZER
      full_name: FLOWER-UNIVERSAL
      type: Жидкое минеральное удобрение для вегетации / общего роста
      purpose: Поддержка роста листьев и корней
      dilution:
        ratio: "6:1000"
        examples:
          - "~1 мл на 166 мл воды"
          - "~6 мл на 1 л воды"
      composition:
        npk:
          nitrogen_n: 5%
          phosphorus_p2o5: 3%
          potassium_k2o: 4%
        amino_acids: 0.1%
        microelements:
          iron_fe: 0.02%
          manganese_mn: 0.01%
          zinc_zn: 0.0015%
          copper_cu: 0.001%
          boron_b: 0.04%
          molybdenum_mo: 0.0008%
      application:
        timing: Поддержка роста листьев и корней
        frequency:
          spring_summer: Раз в 1-2 недели
          winter: 1 раз в месяц
        method: Полив с разведением 6:1000
      suitable_for:
        - Все комнатные растения
        - В период активного роста

    flower_flowering:
      name: FLOWER - FLOWERING PLANTS FERTILIZER
      local_name: דשן לפרחים
      type: Жидкое минеральное удобрение для фазы цветения
      purpose: Для цветущих растений, стимуляция цветения
      dilution:
        ratio: "6:1000"
        examples:
          - "~1 мл на 166 мл воды"
          - "~6 мл на 1 л воды"
      composition:
        npk:
          nitrogen_n: 4%
          phosphorus_p2o5: 3% (растворимый в воде)
          potassium_k2o: 6% (растворимый в воде)
        microelements:
          iron_fe: 0.02%
          manganese_mn: 0.01%
          zinc_zn: 0.001%
          copper_cu: 0.001%
          boron_b: 0.04%
          molybdenum_mo: 0.0008%
      application:
        timing: В период цветения
        frequency:
          spring_summer: 1 раз в неделю
          winter: 1 раз в месяц
        method: Полив с разведением 6:1000
      suitable_for:
        - Цветущие растения
      effects:
        - Стимуляция цветения
        - Поддержка бутонообразования

    flower_orchids:
      name: FLOWER - ORCHIDS FERTILIZER
      local_name: דשן לסחלבים
      brand: PRODUCTOS FLOWER S.A. (Испания)
      importer: Dorgan Ltd. (דורגן בע״מ)
      volume: 300 мл
      standard: ENVE 1099 B
      type: Жидкое удобрение для орхидей (фаза цветения)
      purpose: Закладка цветоносов, поддержание бутонов, продление цветения
      phase: BLOOM / FLOWER (только репродуктивная фаза)
      composition:
        npk:
          nitrogen_n: 0%
          phosphorus_p2o5: 17%
          potassium_k2o: 7%
        npk_note: "0-17-7 — без азота, высокий фосфор для цветения"
        microelements:
          iron_fe: присутствует
          manganese_mn: присутствует
          boron_b: присутствует
          copper_cu: присутствует
          zinc_zn: присутствует
      application:
        timing: Только в период цветения
        method: Полив с разбавлением
        frequency: С перерывами между подкормками
        notes:
          - Не превышать концентрацию
          - Не использовать круглый год
      suitable_for:
        - Орхидеи в фазе цветения
      not_suitable_for:
        - Активный рост листьев
        - Восстановление корней
        - Детки (keiki)
        - Вегетативная фаза
      warnings:
        - НЕ универсальное удобрение
        - НЕ для фазы роста
        - НЕ заменяет базовое питание
        - НЕ использовать как единственный источник питания
      effects:
        - Закладка цветоносов
        - Поддержка бутонов
        - Продление цветения
        - Усиление цветения

    ecogan_orchids:
      name: Ecogan — דשן סחלבים (Orchid Fertilizer)
      brand: Ecogan (Algo, Израиль)
      volume: 250 мл
      type: Жидкое удобрение для орхидей — все сезоны
      purpose: Сбалансированное питание орхидей круглый год
      ready_to_use: false
      composition:
        npk:
          nitrogen_n: 7%
          phosphorus_p2o5: 3%
          potassium_k2o: 7%
        npk_note: "7-3-7 — сбалансированная формула для роста И цветения"
        microelements:
          iron_fe: присутствует
          manganese_mn: присутствует
          zinc_zn: присутствует
          copper_cu: присутствует
          molybdenum_mo: присутствует
      application:
        timing: Круглый год (с корректировкой дозировки)
        method: Развести в воде согласно инструкции
        frequency:
          spring_summer_autumn: 2 колпачка на 5 л воды, каждые 5 дней
          winter: 2 колпачка на 5 л воды, каждые 12 дней
        notes:
          - Использовать при каждом поливе орхидей
      suitable_for:
        - Все виды орхидей
        - Фаленопсис
        - Дендробиум
        - Онцидиум
        - Каттлея
      effects:
        - Стимуляция цветения
        - Поддержка вегетативного роста
        - Укрепление корневой системы
        - Улучшение окраски листьев
      purchase:
        price: null
        currency: ILS
        date: 2026-04-14

  granulated:
    ecogan_multicote:
      name: Экоген (Ecogan) Multicote
      brand: Ecogan
      type: Гранулированное удобрение длительного действия
      purpose: Пролонгированное удобрение длительного действия
      application:
        timing: При посадке
        method: Добавка в грунт
        location: Смешивается с грунтом при пересадке
      characteristics:
        release_type: Постепенное высвобождение питательных веществ
        duration: Длительного действия
      suitable_for:
        - Все комнатные растения
      notes:
        - Удобно для тех, кто забывает о регулярных подкормках
        - Обеспечивает стабильное питание растений

  additives:
    green_farmer_ph_down:
      name: Green Farmer pH-
      brand: Green Farmer
      type: Регулятор кислотности (pH Down)
      purpose: Понижение pH водных растворов
      composition:
        active_components:
          - Кислотная смесь (неорганические кислоты)
          - Вода (растворитель)
      application:
        when: При необходимости понизить pH воды или раствора удобрений
        method: Добавлять по каплям до достижения нужного pH
      target_ph:
        optimal_range: 5.5-6.5 для большинства комнатных растений
      safety:
        - Использовать с осторожностью
        - Не допускать попадания на кожу и в глаза
        - Добавлять постепенно, контролируя pH

    biobizz_bio_up:
      name: BioBizz Bio·Up
      previous_name: Bio·pH+
      brand: BioBizz
      origin: Нидерланды
      volume: 500 мл
      type: Органический регулятор pH (pH Up)
      organic: true
      certification: OMRI
      since: 1992
      purpose: Мягкое повышение pH без вреда для микрофлоры
      description: |
        100% органический регулятор на основе гуминовых кислот.
        В отличие от минеральных pH-Up:
        - Не убивает полезные бактерии и грибы
        - Не разрушает микоризу
        - Сохраняет живую экосистему субстрата
      composition:
        active_components:
          - Гуминовые кислоты (Humic Acids)
        npk: "0-0-0 (не влияет на схему питания)"
      application:
        method: Добавлять по 0.1 мл на 1 л воды (повышает pH на ~0.1)
        steps:
          - Смешать все удобрения в воде
          - Измерить pH
          - Добавить 0.1 мл Bio·Up на литр
          - Перемешать 10 секунд
          - Измерить pH повторно
          - Повторять до нужного значения
        timing:
          - Вегетация
          - Цветение
          - Каждый полив (при необходимости)
      target_ph:
        soil: 6.2-6.5
        vegetation: 5.8-6.0
        flowering: 6.0-6.5
      compatible_with:
        - Все удобрения BioBizz
        - Микориза (DYNOMYCO и др.)
        - Бактериальные добавки
        - Живые почвы
      especially_useful:
        - Мягкая вода
        - Органические субстраты
        - Живые почвы
        - Работа с микоризой
      important_notes:
        - Не содержит NPK
        - Не разрушает микрофлору
        - Безопасен для ежедневного использования
        - Требует контроля pH-метром
      warnings:
        - "pH < 5.0 или > 7.0 = nutrient lockout"

    atami_calmag:
      name: ATAMI CALMAG
      brand: ATAMI
      type: Минеральная добавка Ca/Mg
      purpose: Базовая добавка Ca/Mg для RO-воды
      composition:
        macroelements:
          nitrogen_n: 6%
          calcium_ca: 20%
          magnesium_mg: 12%
        element_form:
          calcium: Водорастворимая форма
          magnesium: Водорастворимая форма
      role:
        base: Базовая часть RO-воды — добавляется ВСЕГДА при использовании осмоса
        extra: Дополнительная доза — ТОЛЬКО при подтверждённом дефиците Ca/Mg
        warning: Не дублировать — CalMag уже входит в target_ppm воды
      application:
        when:
          - Каждый раз при приготовлении воды из RO (базовая доза)
          - Дополнительно только при подтверждённом дефиците
        method: Добавка в RO-воду до target_ppm группы
        dilution: Согласно инструкции производителя
      deficiency_signs:
        calcium:
          - Деформация молодых листьев
          - Некроз краёв листьев
          - Проблемы с точками роста
        magnesium:
          - Межжилковый хлороз старых листьев
          - Пожелтение между жилками
      suitable_for:
        - Томаты и другие овощи
        - Растения в кокосовом субстрате
        - При использовании осмотической воды

    rootech_cloning_gel:
      name: Rootech Cloning Gel
      brand: Technaflora
      origin: Канада (Ванкувер)
      type: Гель для укоренения черенков
      purpose: Стимуляция корнеобразования при вегетативном размножении
      composition:
        active_component:
          iba: 0.55%
          iba_full_name: Indole-3-butyric acid (индолилмасляная кислота)
      application:
        method: Нанести гель на свежий срез черенка перед посадкой
        steps:
          - Сделать чистый срез на черенке
          - Обмакнуть срез в гель на глубину 1-2 см
          - Посадить черенок в подготовленный субстрат
        substrate: Перлит, вермикулит или лёгкая смесь
      suitable_for:
        - Укоренение черенков комнатных растений
        - Вегетативное размножение
      important_notes:
        - Хранить в прохладном тёмном месте
        - Закрывать крышку после использования
        - Не загрязнять гель — при необходимости отложить порцию в отдельную ёмкость
      weight: 7 г

    dynomyco_spark:
      name: DYNOMYCO® Spark
      brand: DYNOMYCO (Groundwork BioAg Ltd.)
      origin: Израиль
      type: Микоризный инокулянт + полезные бактерии
      format: Смачиваемый порошок (Wettable Powder)
      weight: 170 г (6 oz)
      lot: LTF63253
      expiry: 2027-09-03
      purpose: Усиление роста растений через симбиоз с почвенной микрофлорой
      description: |
        3-в-1 микробиологический инокулянт:
        - Эндомикоризные грибы
        - Комплекс полезных бактерий
        - Гуминовые соединения
      composition:
        mycorrhizal_fungi:
          glomus_intraradices: 250 пропагул/г
          glomus_mosseae: 750 пропагул/г
        beneficial_bacteria:
          bacillus_subtilis: 10,000,000 CFU/г
          bacillus_aryabhattai: 10,000,000 CFU/г
          bacillus_pumilus: 10,000,000 CFU/г
          bacillus_velezensis: 10,000,000 CFU/г
          bacillus_licheniformis: 10,000,000 CFU/г
        humic_acid:
          source: Леонардит
          concentration: 90%
        other_ingredients: 10%
      effects:
        - Развитие корневой системы
        - Усвоение питательных веществ
        - Общая жизнеспособность растений
      application:
        dilution:
          ratio: "1 ч.л. (~3 г) на 4 л воды"
          examples:
            - "1 чайная ложка (≈3 г) на 1 галлон (≈4 л)"
        frequency: Каждые 1-2 недели
        max_applications: До 6 применений на растение
        timing:
          - При пересадке
          - При проращивании семян
          - При укоренении черенков
          - На протяжении вегетативной стадии
        method: Полив приготовленным раствором
      storage:
        location: Тёмное, сухое, прохладное место
        temperature: 5-25°C (40-77°F)
        warnings:
          - Не охлаждать
          - Не замораживать
          - Держать контейнер плотно закрытым
      important_notes:
        - НЕ является удобрением
        - После применения избегать внесения стартовых фосфорных удобрений (для максимального эффекта микоризы)
        - Только для садоводства и питомников
      suitable_for:
        - Садовые культуры
        - Питомники
        - Рассада
        - Пересадка растений
        - Все комнатные растения (кроме хищных)
      not_suitable_for:
        - Хищные растения (Dionaea, Drosera, Sarracenia)

    hg_multizyme:
      name: House & Garden MultiZyme
      brand: House & Garden
      volume: 1 л
      type: Энзимная добавка для улучшения усвоения питания
      purpose: Ускорение роста через ферментативное расщепление минералов в зоне корней
      description: |
        Мультиэнзимный комплекс, помогающий корневой системе расщеплять
        больше минералов из воды для полива. Результат — более эффективное
        усвоение удобрений, зелёный и мощный рост.
      application:
        method: Добавка к воде для полива
        timing: Период активного роста
        frequency: Согласно инструкции производителя
      effects:
        - Улучшение усвоения минералов корнями
        - Более эффективное действие удобрений
        - Стимуляция зелёного и мощного роста
      suitable_for:
        - Все комнатные растения
      purchase:
        price: 95
        currency: ILS
        date: 2026-04-14

    silicon_liquid:
      name: Liquid Silicon (Growth Technology)
      brand: Growth Technology
      origin: Великобритания
      volume: 250 мл
      type: Кремниевая добавка для укрепления растений
      purpose: Укрепление клеточных стенок, корневой системы, устойчивость к болезням и вредителям
      composition:
        active_component: Силикат калия (Potassium Silicate) 6%
        note: Даёт и кремний (Si) и немного калия (K)
      description: |
        Кремний — питательный элемент, присутствующий почти в любой
        натуральной почве, но отсутствующий в горшечной культуре и RO-воде.
        Укрепляет клеточные стенки, делая стебли и листья прочнее,
        корневую систему сильнее, и повышая устойчивость к вредителям и болезням.
      application:
        method_root:
          standard: "0.5 мл на 1 л воды (обычная вода)"
          ro_soft: "до 1 мл на 1 л воды (RO / мягкая вода)"
        method_foliar:
          dilution: "2-3 мл на 1 л воды (опрыскивание по листу)"
        frequency: Каждый полив в период активного роста
        mixing_order:
          step_1: "Silicon ПЕРВЫМ в воду — тщательно размешать"
          step_2: "Потом CalMag"
          step_3: "Потом удобрения (FLOWER, Bio Gel и т.д.)"
          step_4: "pH корректировать ПОСЛЕДНИМ"
        warnings:
          - Silicon повышает pH — обязательно проверять после добавления
          - Никогда не смешивать концентраты напрямую — может выпасть осадок
          - Добавлять каждый компонент по одному, перемешивая между ними
      effects:
        - Укрепление клеточных стенок (толще стебли, жёстче листья)
        - Усиление корневой системы
        - Физический барьер для вредителей (тля, паутинный клещ)
        - Повышение устойчивости к грибковым болезням
        - Улучшение жаро- и засухоустойчивости
        - Помощь в усвоении других питательных веществ
      suitable_for:
        - Все комнатные растения
        - Ароидные (особенно с крупными листьями)
        - Гидропоника
      purchase:
        price: 58
        currency: ILS
        quantity: 2
        date: 2026-04-14

    flower_bio_gel:
      name: Bio Gel — ביו ג'ל דשן אצות (FLOWER)
      brand: FLOWER (Испания)
      type: Органическое гель-удобрение на основе морских водорослей
      purpose: Питание + укрепление иммунитета + антистресс
      description: |
        Гелевое удобрение с полноценным NPK и экстрактом морских водорослей.
        Комбинация удобрения и биостимулятора: одновременно питает и укрепляет.
        Особенно рекомендуется перед и после стрессовых периодов.
        100% натуральный, безопасный для окружающей среды.
      volume: 400 мл
      composition:
        npk:
          nitrogen_n: 10%
          phosphorus_p2o5: 7%
          potassium_k2o: 9%
        npk_note: "10-7-9 — сбалансированная формула, выше азот для зелёной массы"
        seaweed: 3%
        seaweed_note: "Натуральный источник витаминов, аминокислот и микроэлементов"
        organic_matter: 1.5%
        microelements:
          iron_fe: 0.1%
          other: "S, Ca, Mg, Na, Al, B, Co, I, Cu, Mn, Zn"
        growth_stimulants:
          - Цитокинины
          - Гиббереллины
          - Ауксины
          - Бетаины
      application:
        method_root:
          dilution: "1 нажатие на 1 л воды"
          notes: Поливать в зону корней до вытекания из дренажа
        method_foliar:
          dilution: "1 нажатие на 2 л воды (половина корневой дозы)"
          notes: Опрыскивать листья
        frequency:
          spring_summer: Раз в 2 недели (март–октябрь)
          autumn_winter: Раз в месяц (ноябрь–февраль)
      effects:
        - Укрепление иммунной системы растения
        - Развитие мощной корневой системы
        - Повышение устойчивости к жаре, холоду и засухе
        - Улучшение структуры и свойств почвы
        - Стимуляция цветения и плодоношения
        - Поддержка здоровой зелёной массы (N 10%)
      suitable_for:
        - Комнатные растения
        - Балконные растения
        - Травы и пряности
        - Садовые растения
      storage:
        - Хранить в затенённом прохладном месте
        - Беречь от детей
        - Не допускать попадания в глаза
        - Держать вдали от продуктов питания
      purchase:
        price: 24
        currency: ILS
        date: 2026-04-14

ppm_limits:
  principle: Удобрения увеличивают общий ppm раствора
  rule: Общий ppm (вода + удобрения) не должен превышать
  limits:
    group_a:
      target_max: 110
      absolute_max: 120
    group_b:
      target_max: 160
      absolute_max: 180
    group_c:
      target_max: 200
      absolute_max: 220
  integration:
    calmag: Входит в базовый ppm воды
    fertilizers: Добавляются поверх — увеличивают ppm
    measure: Всегда измерять итоговый ppm после добавления удобрений

category_mapping:
  aroids: group_b
  sensitive: group_a
  orchids: group_a
  carnivorous: special
  general_houseplants: group_b

default_feeding:
  growth:
    frequency: 1 раз в 2 недели
    fertilizer: flower_universal
    dose:
      group_a: 1/4 от инструкции
      group_b: 1/2 от инструкции
      group_c: 1/2 от инструкции
  slow:
    frequency: 0-1 раз в месяц
    fertilizer: минимально или не удобрять

stop_conditions:
  - Пересадка < 2 недель назад — не удобрять
  - Растение в стрессе — не удобрять
  - Признаки перелива — не удобрять
  - Не уверен — не удобрять

conflicts:
  ecogan_vs_liquid:
    rule: При использовании Ecogan Multicote снизить жидкие подкормки минимум в 2 раза
    warning: Ecogan уже даёт фоновое питание — жидкие удобрения поверх = двойная нагрузка
  dynomyco_vs_phosphorus:
    rule: Не использовать DYNOMYCO одновременно с высокофосфорными удобрениями
    affected: flower_orchids (0-17-7), стартовые фосфорные добавки

core_rules:
  - Лучше недокормить, чем перекормить
  - Если сомневаешься — не удобряй
  - Удобрение никогда не исправляет проблемы с поливом
  - Удобрять только во влажную почву
  - В период покоя (зима) — сократить или прекратить подкормки

watering_frequency_note:
  airy_soil: Субстрат просыхает быстрее — можно чаще поливать, но состав воды не менять
  dense_soil: Субстрат сохнет дольше — реже поливать, но состав воды не менять

settings:
  current_season: growth

