    kf_leon:
      name: KF-LEON
      local_name: תרכיז חומצה פולבית בריכוז גבוה (17%)
      brand: VGI (Израиль)
      source: https://vgi.co.il/product/kf-leon/
      type: Концентрат фульвокислоты (биостимулятор для улучшения почвы и усвоения минералов)
      purpose: Улучшение поглощения питательных веществ листьями и корнями + улучшение структуры и плодородия почвы
      composition:
        active_ingredients_total: 17%
        fulvic_acid: 15%
        sophenins: 1%
        vitamin_complex: 1%
      description: |
        Инновационный концентрат для улучшения поглощения питательных веществ
        тканями листьев и корней и улучшения структуры и плодородия почвы.
        Описывается как полноценная замена сухому или жидкому гумусу.
      benefits:
        - Высокая эффективность на израильских почвах
        - Усиленное усвоение минералов растением
        - Улучшение структуры почвы
        - Активация биотической системы почвы
        - Подходит для гидропоники и беспочвенных субстратов
        - Помогает справляться с абиотическими стрессами
      application:
        home_spray:
          dilution: 10 мл на 1 л воды
          method: Опрыскивание до стекания
        home_watering:
          dilution: 10 мл на 1 л воды
          dose_per_plant: 150–250 мл/растение
          frequency: Раз в месяц
        ornamentals:
          rate: До 50 мл/м²
          method: Полив или опрыскивание
          frequency: Раз в месяц
        agriculture_field:
          rate: 4–5 л/дунам/сезон
          method: Капельный полив
        agriculture_vegetables:
          rate: 2–6 л/дунам/сезон
          method: Полив или опрыскивание
        mixing: Заполнить ёмкость наполовину водой → добавить препарат → размешать → долить водой
        compatibility: Совместим с KF-10 и KF-AMINO
      properties:
        - Не агрессивен
        - Растворим
        - Удобен в применении
      suitable_for:
        - Сад
        - Теплицы
        - Открытое поле
        - Гидропоника
        - Комнатные растения
        - Газоны
      indoor_use:
        verdict: Полезен — стоит держать
        my_opinion: |
          Фульвокислота 15% — научно подтверждённый биостимулятор. Реально
          улучшает усвоение минералов растением, особенно при стрессе и в
          беспочвенных субстратах. В каталоге Юры есть dynomyco_spark с
          гуминовой кислотой 90% — но фульвовая работает иначе (растворима
          при любом pH, впитывается в ткани листа). Не дублирует, а дополняет.
        when_to_use_indoor:
          - При пересадке растения в новый субстрат
          - В период активного роста (раз в месяц с поливом)
          - При признаках стресса (жара, засуха, истощение после цветения)
          - Растения, которые не реагируют на NPK-удобрение (плохое усвоение)
          - Все растения в гидропонике / лехе
        not_for: Замена основного NPK-удобрения — это не источник макроэлементов
        compatible_with: Большинство удобрений (кислый pH, легко смешивается)
        strategy_vs_alternatives:
          dynomyco_spark: КОМПЛЕМЕНТАРНЫ — использовать оба
          rationale: |
            dynomyco = гуминовая кислота 90% + микориза + бактерии. Гуминовая
            работает В ПОЧВЕ, в ткани растения не впитывается. Применяется
            однократно при пересадке (для заселения микоризы).
            KF-LEON = фульвовая 15%. Меньшая молекула, ВПИТЫВАЕТСЯ в листья
            и корни, переносит минералы внутрь. Применяется регулярно.
            Разные молекулы → разная механика → разное применение.
          recommended_combo:
            - При пересадке → dynomyco_spark (одноразово)
            - Регулярно с поливом раз в месяц → KF-LEON
            - При стрессе/жаре → KF-LEON опрыскивание
        collection_targets:
          context_ro_protocol: |
            Юра использует RO + ATAMI CalMag + удобрение + pH Down.
            "Жёсткая вода блокирует минералы" к этому случаю НЕ применимо.
            Реальная польза фульвокислоты на RO-протоколе: повышает эффективность
            усвоения добавленных минералов → можно работать с теми же низкими PPM
            группы A и получать лучший результат, либо снизить дозу удобрения.
          high_priority:
            group_a_plants:
              plants: Калатеи, алоказии, антуриумы, спатифиллум, гузмания, нефролепис, селагинелла
              why: Группа A лимитирована PPM 80-100 (1/4 дозы удобрения) → биодоступность критична. Фульвокислота помогает извлечь больше из малой дозы
              dosing_caution: Маленькая доза 2-3 мл/л, чтобы не превысить PPM группы
            stressed_plants:
              why: При жаре, после пересадки, после реанимации — опрыскивание фульвой ускоряет восстановление
          medium_priority:
            - Все ароидные группы B (monstera, philodendron, epipremnum, syngonium, aglaonema) — улучшение усвоения
            - begonia_maculata — поддержка цветения
            - croton — пестролистность требует много минералов
          skip:
            - dionaea (хищное)
            - sansevieria, zamioculcas (суккуленты — мало подкормок)

    kf_10:
      name: KF-10
      local_name: דשן ביוסטימולנט נוזלי רב-תכליתי
      brand: VGI (Израиль)
      source: https://vgi.co.il/product/kf-10/
      type: Многоцелевое жидкое биостимулирующее удобрение
      purpose: Усиление урожая, вкуса и устойчивости растений
      composition: |
        Морские водоросли (концентраты), белки, витамины, растительные масла,
        минералы, соли, сахара и растительные экстракты (фирменная формула).
        Точные NPK-проценты на странице продукта не указаны.
      benefits:
        - Укрепление корневой системы и улучшение усвоения питательных веществ
        - Улучшение качества плодов, урожая, цвета, размера
        - Повышение устойчивости к жаре, засухе и болезням
        - Стимуляция цветения и плодообразования
        - Поддержка микробиологической активности почвы
      application:
        methods:
          - Капельный полив
          - Листовое опрыскивание (в прохладные часы)
          - Автоматическая система полива
        frequency: Еженедельно или по необходимости
      certifications:
        - Сертифицировано для органического земледелия в Израиле
        - Соответствует стандарту US NOP (National Organic Program)
      warnings:
        - Использовать только чистый опрыскиватель (без остатков пестицидов)
      suitable_for:
        - Овощи, травы и пряности
        - Декоративные растения
        - Газоны
        - Виноградники
        - Листопадные плодовые деревья
        - Субтропические культуры
        - Оливки, миндаль, цитрусовые, финики
        - Срезанные цветы
      indoor_use:
        verdict: Для дома — лишний, дублирует flower_bio_gel
        my_opinion: |
          На сайте сплошные общие обещания про "усиление урожая и вкуса", но
          конкретных NPK-чисел НЕТ. Состав описан как "водоросли, белки,
          витамины, минералы, сахара, экстракты" — это типичный универсальный
          биостимулятор. У Юры в каталоге уже есть flower_bio_gel (FLOWER Bio Gel,
          NPK 10-7-9 + 3% водорослей + цитокинины/гиббереллины/ауксины) —
          намного более прозрачный по составу и тоже на основе водорослей.
          KF-10 предназначен прежде всего для сада/деревьев/плодовых, а не для
          дома (комнатные явно не указаны в suitable_for сайта).
        when_to_use_indoor:
          - Только если уже куплен — заменит flower_bio_gel в ротации
          - Иначе — оставить для будущей категории "сад/деревья"
        not_for: Замена прозрачному NPK-удобрению с понятным составом
        better_alternative_in_catalog: flower_bio_gel
        strategy_vs_flower_bio_gel:
          recommendation: НЕ ЧЕРЕДОВАТЬ — для дома использовать только flower_bio_gel
          rationale: |
            flower_bio_gel имеет ЯСНЫЙ NPK 10-7-9 + 3% водорослей + указанные
            ростовые гормоны (цитокинины, гиббереллины, ауксины). Прозрачный
            состав, понятная дозировка.
            KF-10 — "чёрный ящик": водоросли + белки + витамины без чисел.
            При выборе одного удобрения для дома — Bio Gel прозрачнее и надёжнее.
            KF-10 имеет смысл для сада и плодовых деревьев (его таргет аудитория).
          when_to_use_kf10_indoor:
            - Только если Bio Gel закончился и нужна замена
            - Для большой коллекции, когда хочется варьировать биостимуляторы

