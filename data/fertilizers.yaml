    kf_guard:
      name: KF-GUARD
      local_name: תכשיר דישון והגנה KF-GUARD
      brand: VGI (Израиль)
      source: https://vgi.co.il/product/kf-guard/
      type: Натуральный концентрат для подкормки и защиты растения
      purpose: Улучшение роста, укрепление жизнеспособности, очистка листвы, физический барьер против вредителей
      composition:
        neem_oil: 40%
        plant_oils_total: 40%
        other:
          - Растительные масла и экстракты
          - Натуральные эмульгаторы
          - Натуральные ПАВ
      description: |
        Натуральный концентрат комбинированного действия для улучшения роста,
        укрепления жизнеспособности и тщательной очистки листвы. Создаёт
        физический защитный барьер против заселения вредителей, усиливает
        метаболическую активность, повышает устойчивость к жаре и засухе.
        100% натуральный, не вредит окружающей среде, пчёлам и полезным насекомым.
      application:
        home_spray:
          dilution: 10–20 мл/л воды
          method: Опрыскивание до стекания со всех частей растения, включая нижнюю сторону листьев
        home_drench:
          dilution: 10–20 мл/л воды
          dose_per_plant: 150–250 мл/растение
          frequency: Раз в месяц
        agriculture_spray:
          rate: "1–2% раствор, 15–30 л/дунам"
        agriculture_drench:
          rate: 1–2 л/дунам
        temperature_limit: Не применять при температуре выше 24°C
        pre_harvest_interval: 2 дня
        general:
          - Тщательно перемешать перед применением
          - При первом применении — 2 раза с интервалом 5 дней
          - Не смешивать с пестицидами
          - Встряхнуть перед использованием
      indoor_use:
        verdict: ОБЯЗАТЕЛЕН для домашних — лучший в каталоге против вредителей
        my_opinion: |
          40% масла нима — это очень высокая концентрация (обычные коммерческие
          препараты идут с 0.5–3% нима). Масло нима — золотой стандарт против
          основных вредителей комнатных растений. У Юры в каталоге нет других
          инсектицидов/акарицидов — KF-GUARD заполняет критическую нишу.
          Бонус — двойное действие: защита + поддержка метаболизма.
          Безопасен для людей, домашних животных и опылителей (если выйдешь
          в сад). Одно из лучших приобретений из всего набора.
        when_to_use_indoor:
          - При первых признаках вредителей — обработать сразу 2 раза с интервалом 5 дней
          - Профилактически раз в месяц (полив 10–20 мл/л + опрыскивание)
          - После покупки нового растения (карантин — обработать перед добавлением в коллекцию)
          - Тщательное опрыскивание нижней стороны листьев
        effective_against:
          - Тля (моя оценка по нима — стандартный target)
          - Паутинный клещ
          - Мучнистый червец
          - Щитовка (мягкая)
          - Белокрылка
          - Трипс
        cautions:
          - НЕ применять при температуре выше 24°C (может обжечь листья)
          - Не смешивать с пестицидами
          - Маслянистая плёнка на листьях временно — это нормально
        unique_in_catalog: true
        collection_targets:
          critical_targets:
            calathea_lancifolia:
              vulnerability: Магнит для паутинного клеща (особенно зимой при сухом воздухе)
              recommendation: Профилактика раз в месяц + при первых признаках клеща
            calathea_ornata:
              vulnerability: То же
              recommendation: Профилактика раз в месяц
            begonia_maculata:
              vulnerability: Часто страдает от мучнистого червеца
              recommendation: Профилактика раз в месяц, особенно осмотр пазух листьев
            anthurium_andraeanum:
              vulnerability: Щитовка на черешках и под листьями
              recommendation: При обнаружении — 2 обработки с интервалом 5 дней
            croton:
              vulnerability: Паутинный клещ при низкой влажности
              recommendation: Профилактика опрыскиванием, особенно нижняя сторона листьев
            alocasia_amazonica:
              vulnerability: Тля на молодых листьях, паутинный клещ
              recommendation: Профилактика + при покупке нового растения карантин с обработкой
            alocasia_frydek:
              vulnerability: Бархатные листья сложнее очищать — клещ заводится незаметно
              recommendation: Регулярная профилактика
          general_collection:
            - Профилактика для всех остальных (monstera, philodendron, sansevieria, ZZ и т.д.) раз в 2 месяца
            - При покупке нового растения — обязательный карантин с обработкой перед добавлением в коллекцию
          do_not_apply:
            dionaea:
              reason: Хищное растение — масла блокируют ловушки и нарушают пищеварение
            nephrolepis:
              reason: Папоротник чувствителен к маслам — тест на одной ветке прежде всего
            phalaenopsis:
              reason_caution: Орхидеи в фазу цветения — масла на цветах могут вызвать пятна; обрабатывать только листья и корни вне цветения
            saintpaulia:
              reason_caution: Опушённые листья сенполии — масло остаётся надолго и портит вид; только при крайней необходимости и точечно
            schlumbergera:
              reason_caution: Сегменты могут впитывать масло, в фазу цветения цветы испортятся; только в покое

    kf_iron:
      name: KF-IRON
      brand: VGI (Израиль)
      source: https://vgi.co.il/product/kf-iron/
      type: Хелатное железо
      purpose: Восполнение дефицита железа, улучшение усвоения железа тканями растения
      composition:
        iron_fe: 6.6%
        total_nitrogen: 1.8%
        formulation: Железо в комплексе с аминокислотами и биостимуляторами (хелатный эффект)
      description: |
        Инновационный хелат железа, разработанный VGI. Сочетание железа с
        аминокислотами и биостимуляторами создаёт хелатный эффект, который
        улучшает доступность и усвоение железа тканями растения. Процесс
        хелатирования усиливает проникновение железа в ткани и положительно
        влияет на почвенные микроорганизмы.
      benefits:
        - Улучшение производства хлорофилла
        - Влияние на размер плодов и овощей
        - Повышение доступности и усвоения питательных веществ
      application:
        spray: 3–6 мл/л воды
        watering_can: 10–40 мл/л воды
        drip_irrigation: 200 мл на 20-литровый бак; можно комбинировать с другими KF-продуктами
        agriculture: 1 л/дунам в последнюю треть полива и/или с удобрением
        guidelines:
          - Точно соблюдать дозировку
          - Хорошо встряхнуть перед использованием
          - Не опрыскивать при температуре выше 24°C
          - Применять рано утром или вечером
          - Сначала тестировать на небольшой площади
          - Не смешивать с пестицидами
          - Использовать только чистый опрыскиватель
      suitable_for:
        - Плодовые деревья
        - Домашние сады
        - Овощи
        - Газоны (круглогодично)
      indoor_use:
        verdict: Держать в "аптечке" — для конкретных проблем, не для рутины
        my_opinion: |
          6.6% железа в хелатной форме с аминокислотами — хорошая биодоступная
          форма. Чистого железа в каталоге Юры пока нет (есть только Fe в
          составе flower_universal 0.02% и других — это ничтожные количества
          для лечения хлороза). KF-IRON заполняет нишу, но нужен ТОЛЬКО при
          реальной проблеме — не для рутинной подкормки.
          ВНИМАНИЕ: на сайте VGI комнатные растения ЯВНО НЕ упомянуты в
          suitable_for (только "домашние сады"). Применение для горшечных —
          моя экстраполяция по составу.
        when_to_use_indoor:
          - При признаках железного хлороза (молодые листья жёлтые, прожилки зелёные)
          - Цитрусовые в горшках (известный любители Fe)
          - Гардения, азалия — кальцефобы, склонны к Fe-дефициту
          - Гибискус, рододендрон в горшках
          - Калатеи иногда показывают Fe-дефицит при жёсткой воде
        not_for: Регулярная подкормка здоровых растений (избыток железа токсичен)
        application_indoor: Лейка 10–40 мл/л — но для дома лучше начинать с минимальной дозы
        unique_in_catalog: true
        collection_targets:
          context_corrected: |
            Юра использует RO-протокол: 0 PPM осмос → ATAMI CalMag → удобрение → pH Down.
            Жёсткая вода ДО растения не доходит. Аргумент "Fe блокируется известью"
            здесь НЕ работает.
          actual_fe_situation: |
            На RO-протоколе всё, что получает растение, добавляется руками.
            Базовые удобрения (flower_universal, flower_flowering) содержат лишь 0.02% Fe —
            этого обычно хватает при регулярной ротации. KF-IRON нужен только в
            редких случаях реального Fe-дефицита, не профилактически.
          when_actually_useful:
            scenario_1: |
              Если у растения Группы A (калатеи, алоказии, антуриумы, спатифиллум) появятся
              классические признаки Fe-хлороза — желтеют молодые листья, прожилки остаются
              зелёными — несмотря на регулярную подкормку.
              Группа A получает 1/4 дозы удобрения (PPM 80-100) → теоретически Fe в
              минимальной дозе, может не хватать в долгий период.
            scenario_2: |
              Орхидея фаленопсис в коре — субстрат бедный, Fe вымывается.
              Если появляется хлороз молодых листьев — точечная коррекция.
              ОЧЕНЬ малой дозой (1-2 мл/л).
            scenario_3: |
              Сенполия под досветкой при недостатке Fe в коротком ритме подкормки.
          dosing_caution: |
            Для группы A держать дозу низкой: 2-3 мл/л через лейку, не 10-40 как пишет VGI.
            Иначе превысишь PPM-лимит группы. После добавления — ИЗМЕРИТЬ PPM.
          do_not_apply_to:
            sansevieria: Суккуленты — избыток Fe токсичен
            zamioculcas: То же
            dionaea: Хищные — никаких удобрений
            healthy_plants: Только при подтверждённом хлорозе, не профилактика
          rule_of_thumb: |
            На RO-системе Юры это РЕДКОЕ применение. Сначала проверить, что
            симптомы — действительно Fe-хлороз, а не дефицит N (общая желтизна
            нижних листьев = N) или магний (межжилковая желтизна старых = Mg).
            Применять ТОЛЬКО при подтверждённом Fe-хлорозе на молодых листьях.

    kf_serfico:
      name: KF-SERFICO
      local_name: ביו סטימולנט לשורשים ולשתילות חדשות
      brand: VGI (Израиль)
      source: https://vgi.co.il/product/kf-serfico-bio-organic-root-growth/
      type: Биоорганический биостимулятор укоренения
      purpose: Стимуляция укоренения, ускорение роста, улучшение листового усвоения
      composition:
        - Экстракт морских водорослей
        - Натуральный сапонин из пустынных растений (биологический ПАВ)
        - Без дополнительных добавок
      benefits:
        - Ускорение укоренения и роста растения
        - Улучшение листового усвоения без синтетических ПАВ
        - Повышение микробиологической активности почвы
        - Помощь при солевом стрессе и устойчивость к нематодам
        - Не агрессивен, не токсичен, без осадка
        - Высокая концентрация — экономичное использование
      application:
        home_foliar:
          dilution: 5–10 мл/л воды
          method: Опрыскивание до стекания
        home_monthly:
          dilution: 10 мл/л воды
          dose_per_plant: 150–250 мл раствора/растение
        containers:
          pot_30x30: 10 мл на 1 л воды
          pot_80x80: 15–30 мл на 5 л воды
        agriculture:
          vegetables_berries: 0.5–1 л/дунам
          stone_fruit_grape_citrus: 0.5–1 л/дунам
          method: Капельный полив
      suitable_for:
        - Все типы растений и стадии роста
        - Особенно — новые пересадки
        - Закладка и восстановление газона
        - Питомники
      indoor_use:
        verdict: Полезен при пересадке и черенковании, но частично дублирует существующее
        my_opinion: |
          Водоросли + натуральный сапонин (ПАВ из пустынных растений). Идея —
          ускорение укоренения. У Юры в каталоге уже есть rootech_cloning_gel
          (гель для черенкования) и dynomyco_spark (микориза с гуминовой
          кислотой 90% + бактерии — тоже работает на корни). KF-SERFICO —
          это раствор для полива/опрыскивания, дополняет, но не уникален.
          Натуральный сапонин — приятный бонус: работает как проникающий
          ПАВ для других препаратов при опрыскивании.
        when_to_use_indoor:
          - При каждой пересадке (полив 10 мл/л)
          - При черенковании — опрыскивание молодых растений 5–10 мл/л
          - Как добавка к KF-GUARD при опрыскивании (улучшает прилипание)
          - Растения после стресса для восстановления корней
        complementary_to_catalog:
          - dynomyco_spark — микориза (запускает симбиоз с корнями)
          - rootech_cloning_gel — гель для черенков
          - KF-SERFICO — жидкая поддержка корней при поливе
        unique_in_catalog: false (есть аналоги по функции)
        strategy_vs_alternatives:
          recommendation: КОМПЛЕМЕНТАРНЫ — это не альтернативы, а разные функции
          three_layer_root_strategy:
            layer_1_at_repotting:
              tool: dynomyco_spark
              what: Микориза заселяется в новый субстрат, гуминовая улучшает структуру
              when: Однократно при пересадке
            layer_2_for_propagation:
              tool: rootech_cloning_gel
              what: Гель для обработки среза черенка
              when: При размножении черенками
            layer_3_ongoing_support:
              tool: KF-SERFICO
              what: Регулярное укрепление корней + работает как ПАВ при опрыскивании
              when: Регулярно при поливе и опрыскивании
          do_not_rotate: Они работают на разных этапах и в разных формах
        collection_targets:
          high_value_for:
            alocasia_amazonica:
              why: Алоказии часто страдают от слабых корней, теряют клубни при стрессе
              recommendation: При каждой пересадке + регулярно при поливе
            alocasia_frydek:
              why: То же + бархатные капризные
            alocasia_regal_shields:
              why: Крупные растения — мощная корневая критична
            calathea_lancifolia:
              why: Корни калатей чувствительны к жёсткой воде, слабые
              recommendation: При пересадке + регулярная поддержка корней
            calathea_ornata:
              why: То же
            anthurium_andraeanum:
              why: Цветение зависит от здоровья корней
              recommendation: При пересадке + профилактика после стресса
            anthurium_clarinervium:
              why: Бархатный, медленный — хорошие корни критичны
            saintpaulia:
              why: Сенполии часто страдают от загнивания корней при ошибках полива → SERFICO помогает восстановить после реанимации
              recommendation: При пересадке + опрыскивание после реанимации
          propagation_use:
            - При черенковании monstera_adansonii (опрыскивание молодого растения)
            - При черенковании epipremnum (лиана легко размножается)
            - При черенковании philodendron, syngonium
            - Pairs with rootech_cloning_gel (гель на срез + SERFICO в воду)
          combine_with_kf_guard:
            note: Натуральный сапонин в SERFICO работает как ПАВ → улучшает прилипание KF-GUARD при опрыскивании
            recipe: Смешать KF-GUARD 10 мл/л + KF-SERFICO 5 мл/л в одном опрыскивателе для профилактики
          skip_for:
            - dionaea (хищное)
            - sansevieria, zamioculcas (суккуленты — мало нужны корневые стимуляторы)

    kf_macroboost:
      name: KF-MACRO BOOST
      local_name: דשן אורגני אשלגן וחנקן
      brand: VGI (Израиль)
      source: https://vgi.co.il/product/kf-macro-boost/
      type: Органическое калийно-азотное удобрение
      purpose: Ускорение цветения и улучшение цвета без засоления почвы
      composition:
        soluble_nitrogen: 1.3%
        soluble_potassium_k2o: 4.5%
        additives:
          - Олигосахариды морских водорослей
          - L-пролин (для снижения стресса)
        salt_profile: Низкое содержание хлора и натрия
      benefits:
        - Ускорение цветения, улучшение окраски
        - Безопасная альтернатива минеральным удобрениям (нитрат калия, 20-20-20)
        - Эффективен при низких температурах
        - L-пролин снижает стресс растения
      application:
        manual_spray: 10–100 мл/л воды
        fertigation: 1 л на 20 л воды
        guidelines:
          - Хорошо встряхнуть перед использованием
          - Опрыскивать только при температуре ниже 24°C
        suitable_methods:
          - Почва
          - Гидропоника
          - Листовое опрыскивание
        recommended_conditions:
          - Зимние условия
          - Экстремальная погода
      indoor_use:
        verdict: Реально полезен для коллекции с цветущими — но как K-добавка, не как bloom-замена
        my_opinion: |
          ВАЖНО: NPK = 1.3-0-4.5. ФОСФОРА НЕТ (!). Это НЕ bloom booster в
          классическом смысле — для закладки и развития бутонов нужен P.
          KF-MACROBOOST — это калийная добавка + L-пролин (антистресс) +
          олигосахариды водорослей. Уникальная фишка — заявленная работа
          при низких температурах (актуально для Кацрина зимой).

          В коллекции Юры 7 регулярно цветущих растений (антуриум, бегония
          макулата, гузмания, фаленопсис, сенполия, шлюмбергера, спатифиллум) —
          для них KF-MACROBOOST реально находит роль:
          1. Шлюмбергера: цветёт осенью-зимой в прохладе → L-пролин + работа
             на холоде попадают в самую тему
          2. Сенполия: непрерывное цветение → K продлевает цветение и
             укрепляет цветоносы
          3. Фаленопсис ПОСЛЕ цветения: в период покоя нужен только K (без P) —
             накопление сил для следующего цикла
          4. Остальные цветущие: K-добавка раз в 2–3 месяца поверх flower_flowering

          На сайте VGI комнатные растения не упомянуты явно — но коллекция Юры
          с её цветущими делает этот продукт уместным.
        target_plants_in_collection:
          schlumbergera:
            why: Цветёт осенью-зимой в прохладе. L-пролин против холодового стресса + работа MACROBOOST на холоде попадают точно в задачу
            how: 10 мл/л при поливе раз в 2 недели сентябрь–февраль
            priority: ВЫСОКИЙ
          saintpaulia:
            why: Непрерывное цветение. K продлевает цветение и укрепляет цветоносы (тонкие у фиалок). L-пролин снижает стресс от подоконника
            how: Поверх flower_flowering — раз в 3-4 недели небольшая доза
            priority: ВЫСОКИЙ
          phalaenopsis:
            why: После цветения — период покоя. K без P = именно то, что нужно для накопления сил перед следующим цветением
            how: Раз в 3-4 недели в покое (не во время цветения!)
            priority: СРЕДНИЙ
          anthurium_andraeanum:
            why: Долгие соцветия — K улучшает яркость прицветников и удерживает цвет
            how: Поверх flower_flowering раз в 2 месяца
            priority: СРЕДНИЙ
          spathiphyllum:
            why: Цветение волнами — K помогает удерживать цветоносы
            how: Раз в 2 месяца в фазу цветения
            priority: СРЕДНИЙ
          guzmania:
            why: Цветёт один раз. Прицветник держится месяцами — K помогает удержать цвет
            how: Опрыскивание розетки 5 мл/л раз в месяц во время цветения
            priority: НИЗКИЙ (бромелиевые в целом мало нуждаются в подкормке)
          begonia_maculata:
            why: Цветёт обильно, K укрепляет ткани (бегонии хрупкие)
            how: Раз в 2 месяца в активную фазу
            priority: СРЕДНИЙ
        when_to_use_indoor:
          - Шлюмбергера осенью-зимой — основная цель
          - Цветущие в активной фазе цветения как K-добавка поверх flower_flowering
          - Орхидея в период покоя (БЕЗ цветения — нужно только K)
        not_for:
          - Декоративно-лиственные (аглаонема, монстера, филодендрон, калатея, замиокулькас и т.д.) — им нужен N, не K
          - Хищные растения (dionaea) — вообще никаких удобрений
          - Суккуленты (sansevieria) — слишком много солей
          - Фаза закладки бутонов — нужен P, его в MACROBOOST нет
        better_alternative_in_catalog: flower_flowering для bloom-фазы (там полный NPK 4-3-6)
        strategy_vs_flower_flowering:
          recommendation: |
            НЕ ЧЕРЕДОВАТЬ. Это РАЗНЫЕ роли:
            - flower_flowering = основа цикла цветения (закладка + развитие бутонов)
            - KF-MACROBOOST = K-добавка для конкретных задач (см. target_plants_in_collection)
          how_they_combine:
            - Закладка и развитие бутонов → flower_flowering
            - Финиш цветения / удержание цвета → MACROBOOST поверх (раз в 2-3 мес)
            - Период покоя у орхидеи → MACROBOOST вместо flower_orchids
            - Шлюмбергера осенью-зимой → MACROBOOST основной (плюс при необходимости flower_flowering)


humic_fulvic_reference:
  description: |
    Справочная информация о гуминовых и фульвовых кислотах —
    природных компонентах почвы, продуктах разложения органики
    и метаболизма почвенных организмов.
  humic_acid:
    structure: Крупная молекула, сложная структура
    ph: Щелочной (большинство препаратов)
    water_solubility: Ограничена, зависит от pH
    plant_uptake: Не впитывается в ткани растения — работает только в почве
    function:
      - Улучшение коллоидной структуры почвы
      - Удержание влаги
      - Эффективное удержание минералов в форме, доступной растениям
      - Особенно полезна при засолении и переизбытке удобрений
    production: Извлечение сильными основаниями из ископаемой органики (например, леонардит)
    note: Несмотря на название "кислоты", реакция препаратов обычно щелочная
  fulvic_acid:
    structure: Меньшая молекула, большая удельная поверхность
    ph: Кислый — подходит для прикорневой зоны
    water_solubility: Растворима при любом pH
    oxygen_content: Почти вдвое выше, чем у гуминовой
    plant_uptake: Впитывается в ткани растения, переносит минералы и органические соединения
    function:
      - Биоорганический хелат — повышает биодоступность минералов
      - Эффективна при опрыскивании листьев и поливе
  natural_sources:
    compost: Содержит гуминовые вещества в концентрации намного выше, чем готовые препараты
    recommendation: На бедных почвах компост предпочтительнее покупных препаратов
  philosophy_vgi: |
    Подход VGI: повышать доступность уже имеющихся минералов
    через фульвокислоту и биостимуляторы, а не наращивать дозы
    NPK-удобрений. Это сохраняет почвенную микрофлору, предотвращает
    засоление и продлевает плодородие почвы.

ppm_limits:
  principle: Удобрения увеличивают общий ppm раствора
  rule: Общий ppm (вода + удобрения) не должен превышать
  limits:
    group_a:
      target_max: 110
      absolute_max: 120
    group_b:
      target_max: 160
      absolute_max: 180
    group_c:
      target_max: 200
      absolute_max: 220
    group_v:
      target_max: 130
      absolute_max: 140
  integration:
    calmag: Входит в базовый ppm воды
    fertilizers: Добавляются поверх — увеличивают ppm
    measure: Всегда измерять итоговый ppm после добавления удобрений

category_mapping:
  aroids: group_b
  sensitive: group_a
  orchids: group_a
  carnivorous: special
  general_houseplants: group_b

default_feeding:
  growth:
    frequency: 1 раз в 2 недели
    fertilizer: flower_universal
    dose:
      group_a: 1/4 от инструкции
      group_b: 1/2 от инструкции
      group_c: 1/2 от инструкции
  slow:
    frequency: 0-1 раз в месяц
    fertilizer: минимально или не удобрять

stop_conditions:
  - Пересадка < 2 недель назад — не удобрять
  - Растение в стрессе — не удобрять
  - Признаки перелива — не удобрять
  - Не уверен — не удобрять

conflicts:
  ecogan_vs_liquid:
    rule: При использовании Ecogan Multicote снизить жидкие подкормки минимум в 2 раза
    warning: Ecogan уже даёт фоновое питание — жидкие удобрения поверх = двойная нагрузка
  dynomyco_vs_phosphorus:
    rule: Не использовать DYNOMYCO одновременно с высокофосфорными удобрениями
    affected: flower_orchids (0-17-7), стартовые фосфорные добавки

core_rules:
  - Лучше недокормить, чем перекормить
  - Если сомневаешься — не удобряй
  - Удобрение никогда не исправляет проблемы с поливом
  - Удобрять только во влажную почву
  - В период покоя (зима) — сократить или прекратить подкормки

watering_frequency_note:
  airy_soil: Субстрат просыхает быстрее — можно чаще поливать, но состав воды не менять
  dense_soil: Субстрат сохнет дольше — реже поливать, но состав воды не менять

