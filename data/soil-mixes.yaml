soil_mixes:
  mix_1:
    number: 1
    name: Ароидная (ручной полив)
    watering_type: ручной
    airiness_level: medium
    rot_risk_if_overwatered: medium
    suitable_for:
      - Монстера
      - Филодендрон
      - Эпипремнум
      - Аглаонема
    composition:
      - component: Универсальный грунт Premium
        percentage: 45
      - component: Кокос гас (крупная фракция)
        percentage: 15
      - component: Перлит
        percentage: 15
      - component: Кокос дак (мелкая фракция)
        percentage: 10
      - component: Bark (кора)
        percentage: 10
      - component: Древесный уголь
        percentage: 5
    optional_humus:
      allowed: true
      percentage: 5-10
      replaces: Универсальный грунт Premium
      note: Свой компостный гумус вместо части универсального грунта (45% -> 35-40%)

  mix_1l:
    number: 1-Л
    name: Ароидная облегчённая (для чувствительных к застою)
    watering_type: ручной
    airiness_level: high
    rot_risk_if_overwatered: low
    suitable_for:
      - Антуриум
      - Филодендрон Ксанаду
    notes:
      - Более воздушный субстрат, чем стандартная ароидная смесь Mix #1
      - Для растений, чувствительных к застою воды и гнили корней
      - Universal снижен до 20% — достаточно для питания без лишней влаги
    composition:
      - component: Bark (кора)
        percentage: 25
      - component: Перлит
        percentage: 25
      - component: Универсальный грунт Premium
        percentage: 20
      - component: Кокос гас (крупная фракция)
        percentage: 15
      - component: Кокос дак (мелкая фракция)
        percentage: 10
      - component: Древесный уголь
        percentage: 5
    optional_humus:
      allowed: true
      percentage: 5
      replaces: Универсальный грунт Premium
      note: Только 5% — универсального и так мало (20%), не снижать больше

  mix_2:
    number: 2
    name: Ароидная (фитильный полив)
    watering_type: фитильный
    airiness_level: medium
    rot_risk_if_overwatered: high
    suitable_for:
      - Спатифиллум
      - Монстера (на фитиле)
      - Филодендрон (на фитиле)
    optional_humus:
      allowed: false
      reason: Фитильный полив — гумус слишком влагоёмкий, риск застоя и гнили
    composition:
      - component: Универсальный грунт Premium
        percentage: 35
      - component: Перлит
        percentage: 25
      - component: Кокос гас (крупная фракция)
        percentage: 15
      - component: Bark (кора)
        percentage: 10
      - component: Кокос дак (мелкая фракция)
        percentage: 10
      - component: Древесный уголь
        percentage: 5

  mix_3:
    number: 3
    name: Марантовые (ручной полив)
    watering_type: ручной
    airiness_level: low
    rot_risk_if_overwatered: high
    suitable_for:
      - Калатея лансифолия
      - Калатея орната
    composition:
      - component: Универсальный грунт Premium
        percentage: 40
      - component: Кокос дак (мелкая фракция)
        percentage: 25
      - component: Вермикулит
        percentage: 15
      - component: Перлит
        percentage: 10
      - component: Кокос гас (крупная фракция)
        percentage: 10
    optional_humus:
      allowed: true
      percentage: 5
      replaces: Универсальный грунт Premium
      note: Немного, осторожно — марантовые любят влагу, но гумус добавит ещё влагоёмкости

  mix_4:
    number: 4
    name: Марантовые (фитильный полив)
    watering_type: фитильный
    airiness_level: low
    rot_risk_if_overwatered: high
    suitable_for:
      - Калатея (только при очень внимательном контроле!)
    warnings:
      - КРИТИЧНО - Следить за застоем воды!
      - Кору не использовать или максимум 5%
    optional_humus:
      allowed: false
      reason: Фитильный полив — гумус слишком влагоёмкий
    composition:
      - component: Универсальный грунт Premium
        percentage: 35
      - component: Кокос дак (мелкая фракция)
        percentage: 25
      - component: Перлит
        percentage: 20
      - component: Вермикулит
        percentage: 15
      - component: Кокос гас (крупная фракция)
        percentage: 5

  mix_5:
    number: 5
    name: Универсальная лёгкая (ручной полив)
    watering_type: ручной
    airiness_level: low
    rot_risk_if_overwatered: medium
    suitable_for:
      - Драцена маргината
      - Драцена фрагранс
      - Кротон
      - Хлорофитум
    composition:
      - component: Универсальный грунт Premium
        percentage: 55
      - component: Перлит
        percentage: 20
      - component: Кокос гас (крупная фракция)
        percentage: 10
      - component: Кокос дак (мелкая фракция)
        percentage: 15
    optional_humus:
      allowed: true
      percentage: 5-10
      replaces: Универсальный грунт Premium
      note: Универсального много (55%), есть откуда забрать (55% -> 45-50%)

  mix_5f:
    number: 5-Ф
    name: Универсальная лёгкая (фитильный полив)
    watering_type: фитильный
    airiness_level: medium
    rot_risk_if_overwatered: medium
    suitable_for:
      - Кротон (на фитиле)
    optional_humus:
      allowed: false
      reason: Фитильный полив — гумус слишком влагоёмкий
    composition:
      - component: Универсальный грунт Premium
        percentage: 45
      - component: Перлит
        percentage: 25
      - component: Кокос гас (крупная фракция)
        percentage: 15
      - component: Кокос дак (мелкая фракция)
        percentage: 10
      - component: Bark (кора)
        percentage: 5

  mix_6:
    number: 6
    name: Для пальм
    watering_type: ручной
    airiness_level: low
    rot_risk_if_overwatered: medium
    suitable_for:
      - Хамедорея
    notes:
      - Фитильный полив не рекомендуется — пальмы чувствительны к переливу
    composition:
      - component: Универсальный грунт Premium
        percentage: 55
      - component: Кокос дак (мелкая фракция)
        percentage: 15
      - component: Перлит
        percentage: 10
      - component: Вермикулит
        percentage: 10
      - component: Кокос гас (крупная фракция)
        percentage: 10
    optional_humus:
      allowed: true
      percentage: 5
      replaces: Универсальный грунт Premium
      note: Немного, заменить часть универсального (55% -> 50%)

  mix_7:
    number: 7
    name: Для эпифитов (бромелиевые, лесные кактусы)
    watering_type: ручной
    airiness_level: very_high
    rot_risk_if_overwatered: low
    suitable_for:
      - Гузмания
      - Шлюмбергера (Декабрист)
    optional_humus:
      allowed: false
      reason: Эпифитный субстрат без земли — гумус не нужен, нарушит структуру
    notes:
      - "Для бромелиевых: основной полив в розетку, субстрат лишь для опоры"
      - "Для лесных кактусов: рыхлый быстро просыхающий субстрат"
    composition:
      - component: Bark (кора)
        percentage: 45
      - component: Кокос гас (крупная фракция)
        percentage: 20
      - component: Перлит
        percentage: 15
      - component: Древесный уголь
        percentage: 10
      - component: Кокос дак (мелкая фракция)
        percentage: 10

  mix_8:
    number: 8
    name: Для бегоний
    watering_type: ручной
    airiness_level: medium
    rot_risk_if_overwatered: medium
    suitable_for:
      - Бегония макулата
    optional_humus:
      allowed: false
      reason: Бегонии критично чувствительны к переливу, гумус добавит влагоёмкости
    notes:
      - Фитильный полив НЕ рекомендуется — критичный риск гнили
      - Universal снижен до 30% — бегонии критично чувствительны к переливу
      - Добавлена кора для аэрации, вермикулит снижен
    composition:
      - component: Универсальный грунт Premium
        percentage: 30
      - component: Кокос дак (мелкая фракция)
        percentage: 15
      - component: Перлит
        percentage: 20
      - component: Bark (кора)
        percentage: 15
      - component: Кокос гас (крупная фракция)
        percentage: 10
      - component: Вермикулит
        percentage: 5
      - component: Древесный уголь
        percentage: 5

  mix_9:
    number: 9
    name: Для орхидей
    watering_type: ручной
    airiness_level: very_high
    rot_risk_if_overwatered: low
    suitable_for:
      - Орхидея фаленопсис
    optional_humus:
      allowed: false
      reason: Чистый эпифитный субстрат, никакой земли/гумуса
    critical_requirements:
      pot_type: Прозрачный горшок ОБЯЗАТЕЛЬНО!
      pot_reason: Корни фаленопсис участвуют в фотосинтезе и нуждаются в свете
      control: Прозрачный горшок позволяет контролировать состояние корней и влажность субстрата
    warnings:
      - Субстрат должен быстро просыхать, корни должны дышать
      - Фитильный полив категорически не подходит
      - Полная просушка между поливами
      - При повышенной влажности воздуха процент мха можно уменьшать
    watering_method:
      - Замачивание
      - Пролив по краю
    composition:
      - component: Bark (кора)
        percentage: 60-70
      - component: Сфагнум (мох)
        percentage: 15-20
      - component: Перлит
        percentage: 10-15
      - component: Древесный уголь
        percentage: 5-10
        notes: Для дополнительной сорбции

  mix_10:
    number: 10
    name: Для папоротников
    watering_type: ручной
    airiness_level: medium
    rot_risk_if_overwatered: medium
    suitable_for:
      - Нефролепис
      - Другие папоротники
    optional_humus:
      allowed: true
      percentage: 5
      replaces: Универсальный грунт Premium
      note: Папоротники любят органику (35% -> 30%)
    notes:
      - Папоротники любят постоянно влажный, но не мокрый грунт
      - Фитильный полив не рекомендуется — риск переувлажнения
    composition:
      - component: Универсальный грунт Premium
        percentage: 35
      - component: Кокос дак (мелкая фракция)
        percentage: 25
      - component: Перлит
        percentage: 15
      - component: Вермикулит
        percentage: 10
      - component: Сфагнум (мох)
        percentage: 10
      - component: Древесный уголь
        percentage: 5

  mix_11:
    number: 11
    name: Для суккулентов/сансевиерии
    watering_type: ручной
    airiness_level: high
    rot_risk_if_overwatered: low
    suitable_for:
      - Сансевиерия
      - Замиокулькас (ZZ plant)
      - Суккуленты
    optional_humus:
      allowed: false
      reason: Суккулентам нужна бедная сухая почва, гумус добавит лишнее питание и влагу
    notes:
      - Очень хороший дренаж — главное требование
      - Фитильный полив категорически не подходит
      - Полная просушка между поливами
    composition:
      - component: Универсальный грунт Premium
        percentage: 45
      - component: Перлит
        percentage: 40
      - component: Древесный уголь
        percentage: 10
      - component: Туф/керамзит
        percentage: 5

  mix_12:
    number: 12
    name: Для бархатных антуриумов (без универсального грунта)
    watering_type: ручной
    airiness_level: very_high
    rot_risk_if_overwatered: low
    suitable_for:
      - Антуриум кларинервиум
      - Другие бархатные антуриумы
    optional_humus:
      allowed: false
      reason: Биогумус 10% уже в рецепте — дополнительный гумус не нужен
    notes:
      - Очень воздушный, крупнофракционный субстрат — ключевое требование
      - Без универсального грунта — слишком плотный и влагоёмкий для бархатных
      - Биогумус даёт мягкое питание без лишней влаги
      - Фитильный полив категорически не подходит — риск гнили клубня
      - Горшок с крупными дренажными отверстиями обязателен
    composition:
      - component: Bark (кора)
        percentage: 35
      - component: Перлит
        percentage: 25
      - component: Сфагнум (мох)
        percentage: 10
      - component: Кокос гас (крупная фракция)
        percentage: 10
      - component: Древесный уголь
        percentage: 10
      - component: Биогумус
        percentage: 10

  mix_13:
    number: 13
    name: Для клубневых ароидных (алоказии)
    watering_type: ручной
    airiness_level: very_high
    rot_risk_if_overwatered: low
    optional_humus:
      allowed: false
      reason: Биогумус 5% уже в рецепте — дополнительный гумус не нужен
    suitable_for:
      - Алоказия Regal Shields
      - Алоказия (Polly / Amazonica)
      - Алоказия Фрайдек
      - Алоказия Black Velvet
      - Другие клубневые (corm-based) алоказии
    notes:
      - "Архетип грунта для алоказий: воздушная смесь как база, влагоёмкие компоненты — только понемногу"
      - Без универсального грунта — он долго держит влагу, мало воздуха у корней, выше шанс подгнивания
      - "Кора — каркас и воздух, перлит — аэрация, кокос крупный — немного влаги без болота"
      - "Биогумус — немного питания (не база), уголь — стабилизатор среды"
      - Фитильный полив не рекомендуется
    warnings:
      - "НЕ использовать: вермикулит + биогумус вместе, тяжёлую мелкую смесь, большой горшок с мокрым субстратом"
    adjustments:
      small_corms: Для деток/маленьких клубней — чуть больше мелкой фракции или чаще полив
      dry_conditions: При очень сухом воздухе (<40%) — можно добавить немного влагоёмкости
      rehab: При реанимации — отдельный режим (semi-dry), этот микс не применяется
    composition:
      - component: Bark (кора)
        percentage: 35
      - component: Перлит
        percentage: 30
      - component: Кокос гас (крупная фракция)
        percentage: 15
      - component: Кокос дак (мелкая фракция)
        percentage: 5
      - component: Биогумус
        percentage: 5
      - component: Древесный уголь
        percentage: 10

  mix_14:
    number: 14
    name: Для сенполий / геснериевых (фиалок)
    watering_type: ручной / фитильный
    airiness_level: high
    rot_risk_if_overwatered: medium
    suitable_for:
      - Сенполия (узамбарская фиалка)
      - Стрептокарпус
      - Другие геснериевые
    notes:
      - Фитильный полив рекомендован — сенполии не любят попадание воды на листья
      - Лёгкий, слабокислый, воздушный субстрат
      - Торф — основа, перлит и вермикулит обеспечивают воздух и влагоудержание
      - Уголь для стабилизации среды
    optional_humus:
      allowed: false
      reason: Торф уже обеспечивает органическую базу; гумус повышает риск гнили черешков
    composition:
      - component: Торф верховой (кислый)
        percentage: 50
      - component: Перлит
        percentage: 25
      - component: Вермикулит
        percentage: 15
      - component: Кокос дак (мелкая фракция)
        percentage: 5
      - component: Древесный уголь
        percentage: 5

  mix_carnivorous:
    name: Для хищных растений
    watering_type: поддон
    airiness_level: medium
    rot_risk_if_overwatered: medium
    plant_ids:
      - dionaea
    suitable_for:
      - Дионея (Венерина мухоловка)
    optional_humus:
      allowed: false
      reason: Категорически нет — любые удобрения/органика убивают хищные растения
    warnings:
      - КРИТИЧНО — любые удобрения убивают растение
      - Использовать ТОЛЬКО дистиллят или чистый RO (TDS < 10)
    composition:
      - component: Торф кислый (без удобрений)
        percentage: 70
      - component: Перлит
        percentage: 30

mix_usage_rules:
  mix_1:
    target_dry_time_days: 3-5
    state_fit: [stable]
    not_for: [rehab]
    watering_mode: [hand, wick]
    too_wet_if: влажный >6 дней
    too_dry_if: высыхает <1 дня
    correction_links:
      too_wet: overwatering
      too_dry: underwatering
      dense: dense_soil

  mix_1l:
    target_dry_time_days: 2-4
    state_fit: [stable, sensitive]
    not_for: [rehab]
    watering_mode: [hand]
    too_wet_if: влажный >5 дней
    too_dry_if: высыхает <1 дня
    correction_links:
      too_wet: overwatering
      too_dry: underwatering

  mix_2:
    target_dry_time_days: 4-7
    state_fit: [stable]
    not_for: [rehab, sensitive]
    watering_mode: [wick]
    too_wet_if: влажный постоянно без просушки
    too_dry_if: фитиль не тянет воду
    correction_links:
      too_wet: overwatering
      dense: dense_soil
    notes: На фитиле грунт не должен быть болотом — лёгкая влажность

  mix_3:
    target_dry_time_days: 4-6
    state_fit: [stable]
    not_for: [rehab]
    watering_mode: [hand, wick]
    too_wet_if: влажный >7 дней
    too_dry_if: высыхает <2 дней
    correction_links:
      too_wet: overwatering
      too_dry: underwatering
    notes: Марантовые любят стабильную влажность — пересушка хуже перелива

  mix_4:
    target_dry_time_days: 5-7
    state_fit: [stable]
    not_for: [rehab, sensitive]
    watering_mode: [wick]
    too_wet_if: вода стоит >7 дней
    too_dry_if: фитиль не тянет воду
    correction_links:
      too_wet: overwatering
      dense: dense_soil
    notes: Критичный контроль — фитиль + марантовые = высокий риск

  mix_5:
    target_dry_time_days: 4-6
    state_fit: [stable]
    not_for: [rehab]
    watering_mode: [hand]
    too_wet_if: влажный >7 дней
    too_dry_if: высыхает <2 дней
    correction_links:
      too_wet: overwatering
      too_dry: underwatering

  mix_5f:
    target_dry_time_days: 5-7
    state_fit: [stable]
    not_for: [rehab]
    watering_mode: [wick]
    too_wet_if: влажный постоянно без просушки
    too_dry_if: фитиль не тянет воду
    correction_links:
      too_wet: overwatering

  mix_6:
    target_dry_time_days: 4-6
    state_fit: [stable]
    not_for: [rehab, wick]
    watering_mode: [hand]
    too_wet_if: влажный >7 дней
    too_dry_if: высыхает <2 дней
    correction_links:
      too_wet: overwatering
      too_dry: underwatering

  mix_7:
    target_dry_time_days: 1-3
    state_fit: [stable, sensitive]
    not_for: [rehab, wick]
    watering_mode: [hand]
    too_wet_if: влажный >4 дня
    too_dry_if: не применимо — быстрая просушка норма
    correction_links:
      too_wet: overwatering
    notes: Эпифитный субстрат — должен быстро просыхать. Для бромелиевых основной полив в розетку

  mix_8:
    target_dry_time_days: 3-5
    state_fit: [stable, sensitive]
    not_for: [rehab, wick]
    watering_mode: [hand]
    too_wet_if: влажный >6 дней
    too_dry_if: высыхает <1 дня
    correction_links:
      too_wet: overwatering
      too_dry: underwatering
    notes: Бегонии критично чувствительны к переливу

  mix_9:
    target_dry_time_days: 2-5
    state_fit: [stable]
    not_for: [rehab, wick]
    watering_mode: [hand]
    too_wet_if: влажный >5 дней
    too_dry_if: не применимо — полная просушка норма
    correction_links:
      too_wet: overwatering
    notes: Полная просушка между поливами обязательна. Прозрачный горшок для контроля

  mix_10:
    target_dry_time_days: 3-5
    state_fit: [stable]
    not_for: [rehab]
    watering_mode: [hand, wick]
    too_wet_if: влажный >6 дней
    too_dry_if: высыхает <1 дня
    correction_links:
      too_wet: overwatering
      too_dry: underwatering
    notes: Папоротники не переносят пересушку — стабильная влажность важнее всего

  mix_11:
    target_dry_time_days: 5-10
    state_fit: [stable]
    not_for: [rehab, wick]
    watering_mode: [hand]
    too_wet_if: влажный >10 дней
    too_dry_if: не применимо — полная просушка норма
    correction_links:
      too_wet: overwatering
    notes: Суккулентный режим — полная просушка между поливами

  mix_12:
    target_dry_time_days: 2-4
    state_fit: [stable, sensitive]
    not_for: [rehab, wick]
    watering_mode: [hand]
    too_wet_if: влажный >5 дней
    too_dry_if: высыхает <1 дня
    correction_links:
      too_wet: overwatering
      too_dry: underwatering
    notes: Бархатные антуриумы — воздушный субстрат критичен

  mix_13:
    target_dry_time_days: 2-4
    state_fit: [stable, sensitive]
    not_for: [rehab, wick]
    watering_mode: [hand]
    too_wet_if: влажный >5 дней
    too_dry_if: высыхает <1 дня
    correction_links:
      too_wet: overwatering
      too_dry: underwatering
      rot: root_rot_recovery
    notes: Клубневые алоказии — перелив опаснее пересушки. Клубень жив даже без листьев

  mix_14:
    target_dry_time_days: 3-5
    state_fit: [stable, sensitive]
    not_for: [rehab]
    watering_mode: [hand, wick]
    too_wet_if: влажный >6 дней
    too_dry_if: высыхает <2 дней
    correction_links:
      too_wet: overwatering
      too_dry: underwatering
    notes: Сенполии любят стабильную влажность без переувлажнения. Фитиль идеален — листья не мокнут

  mix_carnivorous:
    target_dry_time_days: never
    state_fit: [stable]
    not_for: [rehab]
    watering_mode: [tray]
    too_wet_if: не применимо — постоянная влажность норма
    too_dry_if: поддон высох
    correction_links: {}
    notes: Постоянно влажный через поддон. ТОЛЬКО дистиллят/RO. Никаких удобрений

general_principles:
  wick_watering_rule: Фитильный полив требует более воздухопроницаемого грунта. Застой воды = гниение корней
  drainage: Всегда используйте дренажный слой из керамзита на дне горшка
  sterilization: Стерилизуйте компоненты перед смешиванием при необходимости
  storage: Храните неиспользованные компоненты в сухом месте
  coco_types_note: "Кокос гас (крупный) — для аэрации. Кокос дак (мелкий) — для влагоудержания. Можно комбинировать в одной смеси в разных пропорциях"
  humus_usage:
    primary_method: При пересадке — замешивать в новую смесь (основной и рекомендуемый способ)
    top_dressing:
      rule: Верхнее внесение — только как редкое исключение для устойчивых растений
      how: Снять немного старого верхнего слоя, добавить тонкий слой сухого рассыпчатого гумуса, затем обычный полив
      conditions:
        - Слой очень небольшой
        - Гумус сухой и рассыпчатый
        - Не должен образовывать плотную мокрую корку
        - Растение не чувствительное к переувлажнению
      allowed_plants:
        - Монстера
        - Филодендрон
        - Эпипремнум
        - Аглаонема
        - Драцена
        - Хлорофитум
        - Кротон
      forbidden_plants:
        - Алоказии
        - Бархатные антуриумы
        - Орхидеи
        - Калатеи
        - Растения в реабилитации
        - Semi-dry / semi-hydro
    safe_rule: "Если сомневаешься — добавляй гумус только при пересадке"
