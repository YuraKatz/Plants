soil_mixes:
  mix_1:
    number: 1
    name: Ароидная (ручной полив)
    watering_type: ручной
    airiness_level: medium
    rot_risk_if_overwatered: medium
    suitable_for:
      - Монстера
      - Филодендрон
      - Эпипремнум
      - Аглаонема
    composition:
      - component: Универсальный грунт Premium
        percentage: 45
      - component: Кокос гас (крупная фракция)
        percentage: 15
      - component: Перлит
        percentage: 15
      - component: Кокос дак (мелкая фракция)
        percentage: 10
      - component: Bark (кора)
        percentage: 10
      - component: Древесный уголь
        percentage: 5

  mix_1l:
    number: 1-Л
    name: Ароидная облегчённая (для чувствительных к застою)
    watering_type: ручной
    airiness_level: high
    rot_risk_if_overwatered: low
    suitable_for:
      - Антуриум
      - Филодендрон Ксанаду
    notes:
      - Более воздушный субстрат, чем стандартная ароидная смесь Mix #1
      - Для растений, чувствительных к застою воды и гнили корней
    composition:
      - component: Универсальный грунт Premium
        percentage: 35
      - component: Bark (кора)
        percentage: 20
      - component: Перлит
        percentage: 20
      - component: Кокос гас (крупная фракция)
        percentage: 15
      - component: Древесный уголь
        percentage: 5
      - component: Кокос дак (мелкая фракция)
        percentage: 5

  mix_2:
    number: 2
    name: Ароидная (фитильный полив)
    watering_type: фитильный
    airiness_level: medium
    rot_risk_if_overwatered: high
    suitable_for:
      - Спатифиллум
      - Монстера (на фитиле)
      - Филодендрон (на фитиле)
    composition:
      - component: Универсальный грунт Premium
        percentage: 35
      - component: Перлит
        percentage: 25
      - component: Кокос гас (крупная фракция)
        percentage: 15
      - component: Bark (кора)
        percentage: 10
      - component: Кокос дак (мелкая фракция)
        percentage: 10
      - component: Древесный уголь
        percentage: 5

  mix_3:
    number: 3
    name: Марантовые (ручной полив)
    watering_type: ручной
    airiness_level: low
    rot_risk_if_overwatered: high
    suitable_for:
      - Калатея лансифолия
      - Калатея орната
    composition:
      - component: Универсальный грунт Premium
        percentage: 40
      - component: Кокос дак (мелкая фракция)
        percentage: 25
      - component: Вермикулит
        percentage: 15
      - component: Перлит
        percentage: 10
      - component: Кокос гас (крупная фракция)
        percentage: 10

  mix_4:
    number: 4
    name: Марантовые (фитильный полив)
    watering_type: фитильный
    airiness_level: low
    rot_risk_if_overwatered: high
    suitable_for:
      - Калатея (только при очень внимательном контроле!)
    warnings:
      - КРИТИЧНО - Следить за застоем воды!
      - Кору не использовать или максимум 5%
    composition:
      - component: Универсальный грунт Premium
        percentage: 35
      - component: Кокос дак (мелкая фракция)
        percentage: 25
      - component: Перлит
        percentage: 20
      - component: Вермикулит
        percentage: 15
      - component: Кокос гас (крупная фракция)
        percentage: 5

  mix_5:
    number: 5
    name: Универсальная лёгкая (ручной полив)
    watering_type: ручной
    airiness_level: low
    rot_risk_if_overwatered: medium
    suitable_for:
      - Драцена маргината
      - Драцена фрагранс
      - Кротон
      - Хлорофитум
    composition:
      - component: Универсальный грунт Premium
        percentage: 55
      - component: Перлит
        percentage: 20
      - component: Кокос гас (крупная фракция)
        percentage: 10
      - component: Кокос дак (мелкая фракция)
        percentage: 15

  mix_5f:
    number: 5-Ф
    name: Универсальная лёгкая (фитильный полив)
    watering_type: фитильный
    airiness_level: medium
    rot_risk_if_overwatered: medium
    suitable_for:
      - Кротон (на фитиле)
    composition:
      - component: Универсальный грунт Premium
        percentage: 45
      - component: Перлит
        percentage: 25
      - component: Кокос гас (крупная фракция)
        percentage: 15
      - component: Кокос дак (мелкая фракция)
        percentage: 10
      - component: Bark (кора)
        percentage: 5

  mix_6:
    number: 6
    name: Для пальм
    watering_type: ручной
    airiness_level: low
    rot_risk_if_overwatered: medium
    suitable_for:
      - Хамедорея
    notes:
      - Фитильный полив не рекомендуется — пальмы чувствительны к переливу
    composition:
      - component: Универсальный грунт Premium
        percentage: 55
      - component: Кокос дак (мелкая фракция)
        percentage: 15
      - component: Перлит
        percentage: 10
      - component: Вермикулит
        percentage: 10
      - component: Кокос гас (крупная фракция)
        percentage: 10

  mix_7:
    number: 7
    name: Для эпифитов (бромелиевые, лесные кактусы)
    watering_type: ручной
    airiness_level: very_high
    rot_risk_if_overwatered: low
    suitable_for:
      - Гузмания
      - Шлюмбергера (Декабрист)
    notes:
      - "Для бромелиевых: основной полив в розетку, субстрат лишь для опоры"
      - "Для лесных кактусов: рыхлый быстро просыхающий субстрат"
    composition:
      - component: Bark (кора)
        percentage: 45
      - component: Кокос гас (крупная фракция)
        percentage: 20
      - component: Перлит
        percentage: 15
      - component: Древесный уголь
        percentage: 10
      - component: Кокос дак (мелкая фракция)
        percentage: 10

  mix_8:
    number: 8
    name: Для бегоний
    watering_type: ручной
    airiness_level: medium
    rot_risk_if_overwatered: high
    suitable_for:
      - Бегония макулата
    notes:
      - Фитильный полив НЕ рекомендуется — критичный риск гнили
    composition:
      - component: Универсальный грунт Premium
        percentage: 45
      - component: Кокос дак (мелкая фракция)
        percentage: 20
      - component: Перлит
        percentage: 15
      - component: Вермикулит
        percentage: 10
      - component: Кокос гас (крупная фракция)
        percentage: 5
      - component: Древесный уголь
        percentage: 5
        optional: true

  mix_9:
    number: 9
    name: Для орхидей
    watering_type: ручной
    airiness_level: very_high
    rot_risk_if_overwatered: low
    suitable_for:
      - Орхидея фаленопсис
    critical_requirements:
      pot_type: Прозрачный горшок ОБЯЗАТЕЛЬНО!
      pot_reason: Корни фаленопсис участвуют в фотосинтезе и нуждаются в свете
      control: Прозрачный горшок позволяет контролировать состояние корней и влажность субстрата
    warnings:
      - Субстрат должен быстро просыхать, корни должны дышать
      - Фитильный полив категорически не подходит
      - Полная просушка между поливами
      - При повышенной влажности воздуха процент мха можно уменьшать
    watering_method:
      - Замачивание
      - Пролив по краю
    composition:
      - component: Bark (кора)
        percentage: 60-70
      - component: Сфагнум (мох)
        percentage: 15-20
      - component: Перлит
        percentage: 10-15
      - component: Древесный уголь
        percentage: 5-10
        notes: Для дополнительной сорбции

  mix_10:
    number: 10
    name: Для папоротников
    watering_type: ручной
    airiness_level: medium
    rot_risk_if_overwatered: medium
    suitable_for:
      - Нефролепис
      - Другие папоротники
    notes:
      - Папоротники любят постоянно влажный, но не мокрый грунт
      - Фитильный полив не рекомендуется — риск переувлажнения
    composition:
      - component: Универсальный грунт Premium
        percentage: 35
      - component: Кокос дак (мелкая фракция)
        percentage: 25
      - component: Перлит
        percentage: 15
      - component: Вермикулит
        percentage: 10
      - component: Сфагнум (мох)
        percentage: 10
      - component: Древесный уголь
        percentage: 5

  mix_11:
    number: 11
    name: Для суккулентов/сансевиерии
    watering_type: ручной
    airiness_level: high
    rot_risk_if_overwatered: low
    suitable_for:
      - Сансевиерия
      - Замиокулькас (ZZ plant)
      - Суккуленты
    notes:
      - Очень хороший дренаж — главное требование
      - Фитильный полив категорически не подходит
      - Полная просушка между поливами
    composition:
      - component: Универсальный грунт Premium
        percentage: 45
      - component: Перлит
        percentage: 40
      - component: Древесный уголь
        percentage: 10
      - component: Туф/керамзит
        percentage: 5

  mix_12:
    number: 12
    name: Для бархатных антуриумов
    watering_type: ручной
    airiness_level: very_high
    rot_risk_if_overwatered: low
    suitable_for:
      - Антуриум кларинервиум
    notes:
      - Очень воздушный, крупнофракционный субстрат — ключевое требование
      - Фитильный полив категорически не подходит — риск гнили клубня
      - Горшок с крупными дренажными отверстиями обязателен
    composition:
      - component: Bark (кора)
        percentage: 35
      - component: Перлит
        percentage: 25
      - component: Универсальный грунт Premium
        percentage: 15
      - component: Древесный уголь
        percentage: 10
      - component: Сфагнум (мох)
        percentage: 10
      - component: Кокос гас (крупная фракция)
        percentage: 5

  mix_13:
    number: 13
    name: Для клубневых ароидных
    watering_type: ручной
    airiness_level: high
    rot_risk_if_overwatered: low
    suitable_for:
      - Алоказия (Polly / Amazonica)
      - Алоказия Фрайдек
      - Другие клубневые/ризомные ароидные
    notes:
      - Более воздушный субстрат, чем стандартная ароидная смесь
      - Снижает риск гнили клубня и застоя воды
      - Фитильный полив не рекомендуется
    composition:
      - component: Bark (кора)
        percentage: 30
      - component: Перлит
        percentage: 25
      - component: Универсальный грунт Premium
        percentage: 20
      - component: Кокос гас (крупная фракция)
        percentage: 10
      - component: Кокос дак (мелкая фракция)
        percentage: 10
      - component: Древесный уголь
        percentage: 5

general_principles:
  wick_watering_rule: Фитильный полив требует более воздухопроницаемого грунта. Застой воды = гниение корней
  drainage: Всегда используйте дренажный слой из керамзита на дне горшка
  sterilization: Стерилизуйте компоненты перед смешиванием при необходимости
  storage: Храните неиспользованные компоненты в сухом месте
  coco_types_note: "Кокос гас (крупный) — для аэрации. Кокос дак (мелкий) — для влагоудержания. Можно комбинировать в одной смеси в разных пропорциях"
