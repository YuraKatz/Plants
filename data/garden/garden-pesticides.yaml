garden_pesticides:

  confidor_350_sc:
    name: Confidor 350 SC
    local_name: קונפידור 350 SC
    brand: Bayer / Adama (уточнить по этикетке)
    type: Системный инсектицид (неоникотиноид)
    formulation: SC (Suspension Concentrate / суспензионный концентрат)
    active_ingredient:
      name: Imidacloprid (имидаклоприд)
      concentration: 350 г/л
    toxicity_class: III (סיכון III)
    mode_of_action: |
      Системный — поглощается корнями и листьями, распределяется по сосудистой системе
      растения. Действует на нервную систему сосущих насекомых (агонист
      никотиновых ацетилхолиновых рецепторов).
    target_pests:
      - Тля (Aphids)
      - Белокрылка (Whitefly)
      - Щитовка (Scale insects)
      - Мучнистый червец (Mealybug)
      - Цикадки (Leafhoppers)
      - Трипс (частично)
    not_effective_against:
      - Клещи (нужен акарицид — Biomectin или серосодержащие)
      - Гусеницы (не контактный, не работает)
      - Плодовые мухи (медфлай — другой механизм нужен)
    pollinator_safety:
      verdict: КРИТИЧНО ОПАСЕН ДЛЯ ПЧЁЛ
      details: |
        Имидаклоприд — главный неоникотиноид, связанный с массовой гибелью пчёл (CCD).
        В ЕС ограничен/запрещён на открытом грунте с 2018. В Израиле ещё разрешён,
        но с ограничениями.
      do_not_apply:
        - Во время цветения растения
        - Когда поблизости цветут другие медоносы
        - В часы активного лёта пчёл (день, тёплая погода)
      apply_only:
        - До цветения или после полного опадения лепестков
        - Вечером/ночью при низкой активности опылителей
    application:
      method:
        - Опрыскивание (foliar) — стандарт
        - Полив под корень (drench) — для системного захвата
      dosage: По этикетке (уточнить — фото обрезано)
    safety:
      - Класс III — токсичен при попадании внутрь и на кожу
      - Использовать СИЗ (перчатки, маска, очки)
      - Не применять при ветре
      - Период ожидания до сбора урожая (PHI) — по этикетке
    use_in_garden:
      verdict: Сильное оружие против сосущих, но НЕ для цветущих деревьев
      when_to_use:
        - Тля на новых побегах ДО цветения (зимой/ранней весной)
        - Щитовка на цитрусовых вне цветения
        - Белокрылка на овощах в теплице
      when_not_to_use:
        - Сейчас (Prunus persica в цветении май 2026) — НЕЛЬЗЯ
        - Любые цветущие растения в саду
      collection_targets: TODO_review_after_tree_records_filled
    source: null  # TODO: уточнить по этикетке производителя и дозировку
    notes_to_verify:
      - Производитель (Bayer оригинал или Adama-генерик)
      - Точная дозировка для деревьев
      - Период ожидания (PHI) для конкретных культур

  nimbi:
    name: Nimbi
    local_name: נים בי
    brand: BioBee (Bio Bee Sde Eliyahu, קיבוץ שדה אליהו)
    source: https://biobee.com
    type: Натуральный инсектицид/акарицид (масло нима)
    formulation: EC (Emulsifiable Concentrate / эмульгируемый концентрат)
    active_ingredient:
      name: Neem oil (масло семян Azadirachta indica)
      concentration: 66%
      key_compound: Azadirachtin (азадирахтин)
    toxicity_class: IV (קרא בעיון, מסוכן — низший класс опасности)
    organic_certification: Разрешён для органического земледелия в Израиле
    mode_of_action: |
      Многофакторный: репеллент, антифидант (нарушает пищевое поведение),
      нарушает гормональный цикл линьки насекомых (IGR), физический барьер
      на листе. Действует медленно — за 3-7 дней.
    target_pests:
      - Тля
      - Паутинный клещ
      - Мучнистый червец
      - Щитовка (мягкая, на ранней стадии)
      - Белокрылка
      - Трипс
      - Минирующие насекомые (частично)
    pollinator_safety:
      verdict: Относительно безопасен (не контактный для пчёл)
      details: |
        Нима не убивает пчёл при контакте (в отличие от неоникотиноидов).
        Но лучше избегать опрыскивания цветков напрямую.
      best_practice:
        - Опрыскивать вечером, когда пчёлы не летают
        - Не наносить на открытые цветки
    application:
      method:
        - Опрыскивание (foliar) — основной способ
        - Полив под корень (для борьбы с почвенными вредителями)
      temperature_limit: Не применять при температуре выше 24°C (риск ожога листьев)
      timing: Утро или вечер
      dosage: По этикетке
    use_in_garden:
      verdict: Базовый профилактический инсектицид — органик, безопасен
      when_to_use:
        - Профилактика на всех плодовых деревьях
        - Первые признаки тли/клеща
        - На цветущих деревьях (с осторожностью — не на цветки)
      relationship_to_kf_guard: |
        У Юры в каталоге уже есть KF-GUARD (нима 40%) — идентичный механизм действия,
        но другая концентрация. Nimbi 66% сильнее. Использовать по очереди или
        выбрать один. Для сада Nimbi предпочтительнее (выше концентрация = эффективнее
        на крупных деревьях).
    notes_to_verify:
      - Точная дозировка по этикетке
      - PHI (период ожидания)

  biomectin:
    name: Biomectin
    local_name: ביומקטין
    brand: Tapazol / Tafna (уточнить по этикетке)
    type: Инсекто-акарицид (קוטל חרקים ואקריות)
    formulation: EC (Emulsifiable Concentrate / תרכיז מתחלב)
    active_ingredient:
      name: Abamectin (абамектин)
      concentration: 18 г/л
      origin: Природный авермектин из Streptomyces avermitilis
    toxicity_class: III (מסוכן לבריאות)
    un_registration: 3082
    licence_il: 1929/08
    volume: 1 литр
    mode_of_action: |
      Воздействует на ГАМК-рецепторы насекомых и клещей → паралич и смерть.
      Транс-ламинарный (проникает в ткань листа, защищает с обеих сторон),
      но не системный (не разносится по растению).
    target_pests_per_label:
      - Овощи (ירקות)
      - Полевые культуры (גד"ש)
      - Сады плодовых (מטעים)
      - Цитрусы (הדרים)
      - Цветы (פרחים)
    target_pests_general:
      - Паутинный клещ (двухвостый, красный)
      - Минирующие насекомые (миниры — лиственные минёры)
      - Нематоды (некоторые)
      - Трипс
      - Колорадский жук
    not_effective_against:
      - Тля (слабый эффект)
      - Сосущие с прочной кутикулой (щитовка взрослая)
      - Плодовые мухи (другой механизм нужен)
    pollinator_safety:
      verdict: ВЫСОКОТОКСИЧЕН для пчёл при опрыскивании
      details: |
        Абамектин крайне токсичен для пчёл в течение нескольких часов после
        опрыскивания, затем токсичность падает (быстрая фотодеградация на свету).
      do_not_apply:
        - Во время цветения
        - В часы активного лёта пчёл
      apply_only:
        - До цветения или после полного опадения лепестков
        - Вечером, когда пчёлы вернулись в улей
    application:
      method: Опрыскивание (foliar)
      temperature_limit: Не применять при температуре выше 25-28°C (риск ожога + быстрая деградация)
      timing: Утро или вечер
      dosage: По этикетке (уточнить)
    safety:
      - Класс III — токсичен
      - СИЗ обязательны
      - PHI (период ожидания) по этикетке для каждой культуры
    use_in_garden:
      verdict: Сильное средство против клеща и листовых минёров — для конкретных проблем, не профилактика
      when_to_use:
        - Сильное заражение паутинным клещом (когда нима не справляется)
        - Минирующие насекомые в листьях цитрусов
        - Нематоды (как часть комплексного подхода)
      when_not_to_use:
        - Сейчас (Prunus persica в цветении май 2026) — НЕЛЬЗЯ
        - Профилактика без подтверждённого вредителя (избыточная химия)
        - На пчёлоопыляемых культурах в цветении
    notes_to_verify:
      - Производитель (на этикетке должен быть полный адрес)
      - Точная дозировка по культурам
      - PHI для косточковых

# Общие правила работы с этими пестицидами

general_rules:
  pollinator_protection:
    rule: НИКОГДА не опрыскивать цветущие растения системными инсектицидами
    affected:
      - confidor_350_sc (имидаклоприд)
      - biomectin (абамектин)
    safe_during_bloom:
      - nimbi (с осторожностью, не на цветки)
      - kf_guard (нима 40%, см. fertilizers.yaml)
    rationale: |
      В саду Юры есть пчёлоопыляемые культуры (косточковые, цитрус, авокадо, манго).
      Гибель пчёл = провал опыления = провал плодоношения. Это в т.ч. может быть
      одной из причин почему персик/нектарин перестал плодоносить — если пестициды
      применялись в цветение в прошлые годы.

  safety:
    - Все три препарата требуют СИЗ (перчатки, маска)
    - Хранить в тени, в герметичной таре, недоступно для детей
    - Не смешивать с удобрениями VGI без проверки совместимости
    - Не смешивать пестициды между собой без проверки

  ipm_priority:
    description: Иерархия применения по принципу IPM (Integrated Pest Management)
    order:
      - 1_monitoring: Сначала диагностика — что за вредитель, насколько сильно
      - 2_cultural: Санитарная обрезка, сбор падалицы, удаление поражённых частей
      - 3_biological: Полезные насекомые, привлечение хищников
      - 4_organic: Nimbi (нима) — первая линия химзащиты
      - 5_targeted: Biomectin (только если конкретный вредитель — клещ/минёр)
      - 6_systemic: Confidor (только при сильном заражении сосущими, вне цветения)

  do_not_use_on:
    - Цветущие растения с пчёлами (для confidor и biomectin)
    - Овощи и плоды менее чем за PHI до сбора (см. этикетку)
    - Хищные растения дома (если случайно занесёшь)
